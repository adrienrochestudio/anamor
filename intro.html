<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ana & Adrien</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root { --blanc:#FAF8F4; --bord:#8B1A2B; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:var(--bord); font-family:'Patrick Hand',cursive; cursor:none; }

  .cursor {
    position:fixed; width:32px; height:32px;
    border:2px solid rgba(250,248,244,0.6);
    border-radius:50%; pointer-events:none; z-index:9999;
    transform:translate(-50%,-50%);
    transition:width .2s, height .2s;
  }
  .cursor.click { width:16px; height:16px; }

  .slide {
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    opacity:0;
    transition:opacity 1.2s ease;
    pointer-events:none;
  }
  .slide.active { opacity:1; pointer-events:all; }
  .slide.out    { opacity:0; pointer-events:none; }

  .hint {
    position:fixed; bottom:36px; left:50%; transform:translateX(-50%);
    font-size:0.85rem; color:rgba(250,248,244,0.35);
    letter-spacing:0.08em; z-index:50; pointer-events:none;
    animation:pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:.7} }

  .counter {
    position:fixed; top:28px; right:32px;
    font-size:0.85rem; color:rgba(250,248,244,0.25); z-index:50;
  }

  /* SLIDE 1 — fond bordeaux, grand texte outline blanc */
  #s1 { background:var(--bord); }
  .s1-big {
    font-size:clamp(5rem,20vw,18rem);
    color:transparent;
    -webkit-text-stroke:2px rgba(250,248,244,0.2);
    line-height:1; letter-spacing:-0.02em;
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-52%);
    user-select:none; pointer-events:none;
  }
  .s1-word {
    font-size:clamp(1rem,2.2vw,1.3rem);
    color:rgba(250,248,244,0.55);
    letter-spacing:0.06em; z-index:1;
    margin-top:6vw;
  }

  /* SLIDE 2 — blanc cassé, texte bordeaux épais */
  #s2 { background:var(--blanc); }
  .s2-text {
    font-size:clamp(2rem,7vw,5.5rem);
    color:var(--bord); line-height:1.05;
    text-align:center; padding:0 40px;
  }
  .s2-line {
    position:absolute; left:0; right:0; height:2px;
    background:rgba(139,26,43,0.07);
  }

  /* SLIDE 3 — bordeaux, cercles blancs */
  #s3 { background:var(--bord); }
  .s3-ring {
    position:absolute; border-radius:50%;
    border:2px solid rgba(250,248,244,0.12);
    top:50%; left:50%; transform:translate(-50%,-50%);
  }
  .s3-text {
    font-size:clamp(0.9rem,2vw,1.2rem);
    color:rgba(250,248,244,0.55);
    letter-spacing:0.16em; text-transform:uppercase;
    z-index:1; text-align:center;
  }

  /* SLIDE 4 — blanc, citation manuscrite */
  #s4 { background:var(--blanc); }
  .s4-quote {
    font-size:clamp(1.3rem,3.5vw,2.6rem);
    color:var(--bord); text-align:center;
    line-height:1.55; max-width:680px;
    padding:0 48px; z-index:1;
  }
  .s4-author {
    margin-top:20px; font-size:0.9rem;
    color:rgba(139,26,43,0.45); z-index:1;
  }
  /* Trait épais horizontal décoratif */
  .s4-trait {
    position:absolute; left:10%; right:10%;
    height:2px; background:rgba(139,26,43,0.08);
  }

  /* SLIDE 5 — bordeaux, A&A en négatif */
  #s5 { background:var(--bord); }
  .s5-text {
    font-size:clamp(4rem,18vw,16rem);
    color:var(--blanc); line-height:1;
    letter-spacing:0.04em; z-index:1;
  }
  .s5-sub {
    font-size:clamp(0.85rem,1.8vw,1.1rem);
    color:rgba(250,248,244,0.35);
    letter-spacing:0.22em; text-transform:uppercase;
    z-index:1; margin-top:8px;
  }

  /* SLIDE 6 — blanc, invitation finale */
  #s6 { background:var(--blanc); }
  .s6-title {
    font-size:clamp(3rem,10vw,8rem);
    color:var(--bord); line-height:1;
    text-align:center; z-index:1;
  }
  .s6-enter {
    margin-top:32px; font-size:0.9rem;
    color:rgba(139,26,43,0.35);
    letter-spacing:0.18em; text-transform:uppercase;
    border-bottom:2px solid rgba(139,26,43,0.25);
    padding-bottom:3px; z-index:1;
    animation:pulse 2s ease-in-out infinite;
  }
  /* Cadre en traits épais */
  .s6-frame {
    position:absolute;
    top:40px; left:40px; right:40px; bottom:40px;
    border:2px solid rgba(139,26,43,0.08);
    pointer-events:none;
  }

  .fade-cover {
    position:fixed; inset:0;
    background:var(--blanc); z-index:200;
    opacity:0; pointer-events:none;
    transition:opacity .7s ease;
  }
  .fade-cover.on { opacity:1; pointer-events:all; }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="counter" id="counter">01 / 06</div>
<div class="hint" id="hint">cliquer pour continuer</div>
<div class="fade-cover" id="fade"></div>

<!-- S1 -->
<div class="slide" id="s1">
  <div class="s1-big">A</div>
  <div class="s1-word">quelque chose commence</div>
</div>

<!-- S2 -->
<div class="slide" id="s2">
  <div id="s2-lines"></div>
  <div class="s2-text">entre Paris<br>et São Paulo</div>
</div>

<!-- S3 -->
<div class="slide" id="s3">
  <div class="s3-ring" style="width:72vmin;height:72vmin"></div>
  <div class="s3-ring" style="width:52vmin;height:52vmin;border-color:rgba(250,248,244,0.08)"></div>
  <div class="s3-ring" style="width:32vmin;height:32vmin;border-color:rgba(250,248,244,0.06)"></div>
  <div class="s3-text">la distance<br>n'est que du temps</div>
</div>

<!-- S4 -->
<div class="slide" id="s4">
  <div class="s4-trait" style="top:30%"></div>
  <div class="s4-trait" style="bottom:30%"></div>
  <div class="s4-quote">« Aimer, ce n'est pas se regarder l'un l'autre, c'est regarder ensemble dans la même direction. »</div>
  <div class="s4-author">Antoine de Saint-Exupéry</div>
</div>

<!-- S5 -->
<div class="slide" id="s5">
  <div class="s5-text">A&A</div>
  <div class="s5-sub">Ana &amp; Adrien</div>
</div>

<!-- S6 -->
<div class="slide" id="s6">
  <div class="s6-frame"></div>
  <div class="s6-title">Ana & Adrien</div>
  <div class="s6-enter">entrer</div>
</div>

<script>
if (sessionStorage.getItem('intro-seen')==='1') {
  window.location.replace('index.html');
}

// Curseur
const cur = document.getElementById('cursor');
document.addEventListener('mousemove', e => { cur.style.left=e.clientX+'px'; cur.style.top=e.clientY+'px'; });
document.addEventListener('mousedown', ()=>cur.classList.add('click'));
document.addEventListener('mouseup',   ()=>cur.classList.remove('click'));

// Lignes S2
const lw = document.getElementById('s2-lines');
for(let i=0;i<20;i++){ const d=document.createElement('div'); d.className='s2-line'; d.style.top=(i*5.2)+'%'; lw.appendChild(d); }

// Slides
const slides = document.querySelectorAll('.slide');
const N = slides.length;
let cur2 = 0, locked = false;

function show(i) {
  slides[i].classList.add('active');
  document.getElementById('counter').textContent = String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0');
}

function next() {
  if (locked) return;
  locked = true;
  document.getElementById('hint').style.opacity='0';

  if (cur2===N-1) {
    document.getElementById('fade').classList.add('on');
    setTimeout(()=>{ sessionStorage.setItem('intro-seen','1'); window.location.href='index.html'; }, 750);
    return;
  }

  slides[cur2].classList.add('out');
  slides[cur2].classList.remove('active');
  cur2++;
  setTimeout(()=>{ show(cur2); locked=false; }, 400);
}

document.addEventListener('click',   next);
document.addEventListener('touchend', e=>{ e.preventDefault(); next(); }, {passive:false});
document.addEventListener('keydown',  e=>{ if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight') next(); });

show(0);
</script>
</body>
</html>
