<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mots croisés — Ana & Adrien</title>
<link rel="stylesheet" href="style.css">
<style>
  .page-header{padding:40px 40px 24px;border-bottom:var(--trait) solid var(--bord-l);display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  .page-header h1{font-size:2rem;color:var(--bord);}
  .score-badge{font-size:0.9rem;color:var(--bord);border:var(--trait) solid var(--bord);padding:6px 18px;}
  .grid-tabs{padding:24px 40px 0;display:flex;gap:8px;flex-wrap:wrap;}
  .tab{padding:8px 20px;border:var(--trait) solid var(--bord-l);background:transparent;font-family:'Patrick Hand',cursive;font-size:0.9rem;cursor:pointer;color:var(--muted);transition:all .18s;}
  .tab.active,.tab:hover{background:var(--bord);color:var(--blanc);border-color:var(--bord);}
  .game-area{padding:32px 40px;display:flex;gap:40px;flex-wrap:wrap;align-items:start;}
  table.cw{border-collapse:collapse;}
  table.cw td{width:36px;height:36px;border:var(--trait) solid var(--bord-l);position:relative;text-align:center;}
  table.cw td.black{background:var(--bord);border-color:var(--bord);}
  table.cw td input{width:100%;height:100%;border:none;background:transparent;text-align:center;font-family:'Patrick Hand',cursive;font-size:1rem;color:var(--text);text-transform:uppercase;outline:none;cursor:pointer;}
  table.cw td input:focus{background:var(--bord-l);}
  table.cw td input.correct{background:var(--bord);color:var(--blanc);}
  table.cw td input.wrong{background:var(--bord-l);color:var(--bord);}
  .cell-num{position:absolute;top:1px;left:2px;font-size:8px;color:var(--muted);pointer-events:none;line-height:1;}
  .clues{min-width:200px;}
  .clues h3{font-size:1rem;color:var(--bord);margin-bottom:10px;margin-top:16px;}
  .clues h3:first-child{margin-top:0;}
  .clue-list{list-style:none;}
  .clue-list li{font-size:0.88rem;color:var(--text);padding:5px 0;border-bottom:1px solid var(--bord-l);display:flex;gap:8px;line-height:1.4;}
  .clue-list li span:first-child{color:var(--bord);font-size:0.8rem;min-width:20px;flex-shrink:0;}
  .actions{padding:0 40px 20px;display:flex;gap:10px;flex-wrap:wrap;}
  .result{padding:14px 40px;border-left:var(--trait) solid var(--bord);font-size:0.95rem;color:var(--muted);margin:0 40px 40px;display:none;}
  .result.show{display:block;}
</style>
</head>
<body>
<nav class="nav"><a href="index.html" class="back-btn">← retour</a><div class="nav-title">Mots croisés</div><div></div></nav>
<div class="page-header"><h1>Mots croisés</h1><div class="score-badge" id="score-badge">0 pts</div></div>
<div class="grid-tabs" id="grid-tabs"></div>
<div class="game-area" id="game-area"></div>
<div class="actions">
  <button class="btn btn-full" onclick="checkGrid()">vérifier</button>
  <button class="btn" onclick="resetGrid()">effacer</button>
</div>
<div class="result" id="result"></div>
<footer>Ana & Adrien</footer>
<script>
const GRIDS=[
  {title:"Amour",grid:[['A','M','O','U','R','#','#'],['#','#','O','#','O','#','#'],['B','A','I','S','E','R','#'],['#','#','#','#','#','#','#'],['#','C','O','E','U','R','#'],['#','#','#','#','#','#','#'],['#','B','A','I','S','E','R']],clues:{across:[{num:1,clue:"Le sentiment qui unit deux personnes"},{num:3,clue:"Geste tendre sur les lèvres"},{num:5,clue:"Organe qui bat pour toi"}],down:[{num:1,clue:"Mouvement doux (infinitif)"},{num:2,clue:"Donne des papillons"}]}},
  {title:"Voyage",grid:[['P','A','R','I','S','#','#'],['#','#','#','#','A','#','#'],['#','B','R','E','S','I','L'],['#','#','#','#','I','#','#'],['#','A','V','I','O','N','#'],['#','#','#','#','N','#','#'],['#','#','#','#','#','#','#']],clues:{across:[{num:1,clue:"Capitale de la France"},{num:3,clue:"Grand pays d'Amérique du Sud"},{num:5,clue:"Moyen de transport pour voyager loin"}],down:[{num:2,clue:"Passion intense"},{num:4,clue:"Ce qu'on ressent ensemble"}]}},
  {title:"Nature",grid:[['F','L','E','U','R','#','#'],['#','#','#','#','O','#','#'],['#','S','O','L','E','I','L'],['#','#','#','#','#','#','#'],['#','M','E','R','#','#','#'],['#','#','#','#','#','#','#'],['#','#','E','T','O','I','L']],clues:{across:[{num:1,clue:"Belle plante qu'on offre"},{num:3,clue:"Astre du jour"},{num:5,clue:"Grande étendue d'eau salée"},{num:7,clue:"Point brillant la nuit"}],down:[{num:2,clue:"… douce de la nuit"},{num:4,clue:"Ce qui brille en toi"}]}},
];
let cur=0,score=parseInt(localStorage.getItem('mc-score')||'0'),done=JSON.parse(localStorage.getItem('mc-done')||'[]');
document.getElementById('score-badge').textContent=score+' pts';

const tabs=document.getElementById('grid-tabs');
GRIDS.forEach((g,i)=>{const b=document.createElement('button');b.className='tab'+(i===0?' active':'');b.textContent=(done.includes(i)?'✓ ':'')+g.title;b.onclick=()=>{cur=i;loadGrid(i);document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('active',j===i));};tabs.appendChild(b);});

function loadGrid(idx){
  const g=GRIDS[idx];const area=document.getElementById('game-area');area.innerHTML='';
  const rows=g.grid.length,cols=g.grid[0].length;
  const nums=Array.from({length:rows},()=>Array(cols).fill(0));
  let n=1;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if(g.grid[r][c]==='#')continue;const as=(c===0||g.grid[r][c-1]==='#')&&c+1<cols&&g.grid[r][c+1]!=='#';const ds=(r===0||g.grid[r-1][c]==='#')&&r+1<rows&&g.grid[r+1][c]!=='#';if(as||ds)nums[r][c]=n++;}
  const table=document.createElement('table');table.className='cw';
  const inputs=[];
  for(let r=0;r<rows;r++){const tr=document.createElement('tr');for(let c=0;c<cols;c++){const td=document.createElement('td');if(g.grid[r][c]==='#'){td.className='black';}else{if(nums[r][c]){const s=document.createElement('span');s.className='cell-num';s.textContent=nums[r][c];td.appendChild(s);}const inp=document.createElement('input');inp.type='text';inp.maxLength=1;inp.dataset.r=r;inp.dataset.c=c;inp.dataset.ans=g.grid[r][c];inp.addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase().slice(-1);e.target.classList.remove('correct','wrong');});if(!inputs[r])inputs[r]=[];inputs[r][c]=inp;td.appendChild(inp);}tr.appendChild(td);}table.appendChild(tr);}
  const cluesEl=document.createElement('div');cluesEl.className='clues';
  ['across','down'].forEach(dir=>{const h=document.createElement('h3');h.textContent=dir==='across'?'→ Horizontal':'↓ Vertical';cluesEl.appendChild(h);const ul=document.createElement('ul');ul.className='clue-list';(g.clues[dir]||[]).forEach(cl=>{const li=document.createElement('li');li.innerHTML=`<span>${cl.num}.</span><span>${cl.clue}</span>`;ul.appendChild(li);});cluesEl.appendChild(ul);});
  area.appendChild(table);area.appendChild(cluesEl);
  document.getElementById('result').classList.remove('show');
}

function checkGrid(){
  const inps=document.querySelectorAll('input[data-ans]');let ok=0,tot=0;
  inps.forEach(i=>{tot++;if(i.value.toUpperCase()===i.dataset.ans){i.classList.add('correct');i.classList.remove('wrong');ok++;}else if(i.value){i.classList.add('wrong');i.classList.remove('correct');}});
  const r=document.getElementById('result');r.classList.add('show');
  if(ok===tot){r.textContent='Parfait ! Grille complète. +10 points';if(!done.includes(cur)){done.push(cur);localStorage.setItem('mc-done',JSON.stringify(done));score+=10;localStorage.setItem('mc-score',score);document.getElementById('score-badge').textContent=score+' pts';document.querySelectorAll('.tab')[cur].textContent='✓ '+GRIDS[cur].title;}}
  else r.textContent=ok+'/'+tot+' lettres correctes.';
}

function resetGrid(){document.querySelectorAll('input[data-ans]').forEach(i=>{i.value='';i.classList.remove('correct','wrong');});document.getElementById('result').classList.remove('show');}

loadGrid(0);
</script>
</body>
</html>
