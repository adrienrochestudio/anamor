<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crosswords — Ana & Adrien</title>
<link rel="stylesheet" href="style.css">
<style>
  /* ── LAYOUT ── */
  body { background: var(--blanc); }

  .page-header {
    padding: 36px 40px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .page-header h1 { font-size: 2rem; color: var(--bord); }
  .score-badge {
    font-size: 0.9rem; color: var(--bord);
    border: var(--trait) solid var(--bord);
    padding: 6px 18px;
  }

  /* Sélecteur de grille */
  .grid-tabs {
    padding: 0 40px 24px;
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .tab {
    padding: 7px 14px;
    border: var(--trait) solid var(--bord-l);
    background: transparent;
    font-family: 'Patrick Hand', cursive; font-size: 0.82rem;
    cursor: pointer; color: var(--muted);
    transition: all .15s;
    display: flex; flex-direction: column; gap: 2px; align-items: center;
  }
  .tab .tab-name { font-size: 0.82rem; }
  .tab .tab-diff { font-size: 0.65rem; color: var(--muted); }
  .tab.active, .tab:hover { background: var(--bord); color: var(--blanc); }
  .tab.active .tab-diff, .tab:hover .tab-diff { color: rgba(250,248,244,0.6); }
  .tab.done .tab-name::before { content: '✓ '; }

  /* Zone de jeu : ¾ grille + ¼ consignes */
  .game-area {
    display: grid;
    grid-template-columns: 3fr 1fr;
    gap: 0;
    padding: 0 40px 40px;
    min-height: 60vh;
  }

  /* ── GRILLE ── */
  .grid-col {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .grid-title {
    font-size: 1.1rem; color: var(--bord);
    margin-bottom: 16px; text-align: center;
    letter-spacing: 0.03em;
  }

  .cw-table {
    border-collapse: collapse;
  }

  .cw-table td {
    width: 42px; height: 42px;
    border: var(--trait) solid var(--bord-l);
    position: relative; text-align: center;
    padding: 0;
  }

  .cw-table td.black {
    background: var(--bord);
    border-color: var(--bord);
  }

  .cw-table td input {
    width: 100%; height: 100%;
    border: none; background: transparent;
    text-align: center;
    font-family: 'Patrick Hand', cursive; font-size: 1.1rem; font-weight: bold;
    color: var(--text);
    text-transform: uppercase; outline: none; cursor: pointer;
    caret-color: transparent;
  }

  .cw-table td input:focus { background: rgba(139,26,43,0.08); }
  .cw-table td input.correct { background: var(--bord); color: var(--blanc); }
  .cw-table td input.wrong   { background: rgba(139,26,43,0.15); color: var(--bord); }
  .cw-table td input.selected { background: rgba(139,26,43,0.14); }

  .cell-num {
    position: absolute; top: 2px; left: 3px;
    font-size: 8px; color: var(--muted);
    pointer-events: none; line-height: 1;
    font-family: 'Patrick Hand', cursive;
  }

  /* Actions */
  .game-actions {
    margin-top: 20px;
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
  }

  /* Message résultat */
  .result-msg {
    margin-top: 14px;
    font-size: 0.95rem; color: var(--muted);
    text-align: center; min-height: 24px;
  }
  .result-msg.win { color: var(--bord); font-size: 1.1rem; }

  /* Share */
  .share-btn {
    display: none;
    margin-top: 10px;
    padding: 10px 24px;
    background: transparent;
    border: var(--trait) solid var(--bord);
    font-family: 'Patrick Hand', cursive; font-size: 0.9rem;
    color: var(--bord); cursor: pointer;
    transition: all .15s;
  }
  .share-btn:hover { background: var(--bord); color: var(--blanc); }
  .share-btn.show { display: inline-block; }

  /* ── CONSIGNES ── */
  .clues-col {
    padding-left: 28px;
    border-left: var(--trait) solid var(--bord-l);
    font-size: 0.85rem;
    overflow-y: auto;
    max-height: 80vh;
  }

  .clues-col h3 {
    font-size: 0.9rem; color: var(--bord);
    margin: 0 0 8px; padding-bottom: 4px;
    border-bottom: 1px solid var(--bord-l);
  }
  .clues-col h3:not(:first-child) { margin-top: 20px; }

  .clue-list { list-style: none; margin-bottom: 4px; }
  .clue-list li {
    display: flex; gap: 8px;
    padding: 4px 0; line-height: 1.4;
    border-bottom: 1px solid var(--bord-l);
    color: var(--text);
    cursor: pointer;
    transition: color .15s;
  }
  .clue-list li:hover { color: var(--bord); }
  .clue-list li.active-clue { color: var(--bord); font-weight: bold; }
  .clue-list li span:first-child {
    color: var(--bord); min-width: 22px; flex-shrink: 0; font-size: 0.8rem;
  }

  /* ── MODAL SOLUTION ── */
  .sol-overlay {
    display:none; position:fixed; inset:0;
    background:rgba(250,248,244,0.92);
    backdrop-filter:blur(6px);
    z-index:300;
    align-items:center; justify-content:center;
    flex-direction:column; gap:0;
  }
  .sol-overlay.active { display:flex; }

  .sol-screen {
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:28px;
    text-align:center;
    padding:40px;
    animation:fadeUp .35s ease;
  }
  .sol-screen.active { display:flex; }

  @keyframes fadeUp {
    from{opacity:0;transform:translateY(12px)}
    to{opacity:1;transform:translateY(0)}
  }

  .sol-img-wrap {
    width:min(52vw,280px); height:min(52vw,280px);
    display:flex; align-items:center; justify-content:center;
  }
  .sol-img-wrap img {
    width:100%; height:100%; object-fit:contain;
  }
  /* Placeholder image — remplace par <img src="..."> */
  .sol-img-placeholder {
    width:100%; height:100%;
    border:2px dashed var(--bord); opacity:0.2;
    display:flex; align-items:center; justify-content:center;
    font-size:0.8rem; color:var(--bord);
    flex-direction:column; gap:6px;
  }

  .sol-text {
    font-size:clamp(1.6rem,5vw,3rem);
    color:var(--bord);
    line-height:1.2;
  }

  .sol-subtext {
    font-size:0.95rem; color:var(--muted);
  }

  /* Grille solution */
  .sol-grid-wrap {
    overflow:auto; max-width:90vw; max-height:70vh;
  }
  .sol-grid-wrap table { border-collapse:collapse; }
  .sol-grid-wrap td {
    width:36px; height:36px;
    border:var(--trait) solid var(--bord-l);
    text-align:center; font-family:'Patrick Hand',cursive;
    font-size:1rem; font-weight:bold;
    color:var(--bord); background:transparent;
  }
  .sol-grid-wrap td.sol-black { background:var(--bord); border-color:var(--bord); }
  .sol-grid-wrap td .sol-num {
    display:block; font-size:8px; color:var(--muted);
    line-height:1; text-align:left; padding-left:2px;
    font-weight:normal;
  }

  .sol-close {
    margin-top:8px;
    font-size:0.82rem; color:var(--muted);
    background:none; border:none;
    font-family:'Patrick Hand',cursive;
    cursor:pointer; text-decoration:underline;
    transition:color .15s;
  }
  .sol-close:hover { color:var(--bord); }

  @media(max-width:700px) {
    .game-area { grid-template-columns: 1fr; }
    .clues-col { border-left: none; border-top: var(--trait) solid var(--bord-l); padding: 20px 0 0; max-height: none; }
  }
</style>

    <button class="btn btn-full" onclick="solNext(3)">yes ok just show me</button>
    <button class="sol-close" onclick="closeSol()">ok ok i'll try again</button>
  </div>

  <!-- Écran 3 : la solution -->
  <div class="sol-screen" id="sol-s3">
    <div class="sol-text" style="font-size:1.4rem;margin-bottom:4px">ok fine. here it is.</div>
    <div class="sol-grid-wrap" id="sol-grid-wrap"></div>
    <button class="btn btn-full" onclick="applySolution()">fill it in for me</button>
    <button class="sol-close" onclick="closeSol()">close</button>
  </div>

</div>

//  ÉTAT
// ══════════════════════════════════════════════════════════════
let currentGrid   = 0;
let score         = parseInt(localStorage.getItem('cw-score') || '0');
let doneGrids     = JSON.parse(localStorage.getItem('cw-done') || '[]');
let inputMap      = []; // inputMap[r][c] = <input> element
let cellSequence  = []; // liste ordonnée des inputs de la direction courante
let activeDir     = 'across';
let activeClueNum = null;

document.getElementById('score-badge').textContent = score + ' pts';

// ── ONGLETS ──────────────────────────────────────────────────
const tabsEl = document.getElementById('grid-tabs');
GRIDS.forEach((g, i) => {
  const btn = document.createElement('button');
  btn.className = 'tab' + (i === 0 ? ' active' : '') + (doneGrids.includes(i) ? ' done' : '');
  btn.innerHTML = `<span class="tab-name">${g.name}</span><span class="tab-diff">${'·'.repeat(g.diff)}</span>`;
  btn.onclick = () => {
    currentGrid = i;
    buildGrid(i);
    document.querySelectorAll('.tab').forEach((t, j) => t.classList.toggle('active', j === i));
  };
  tabsEl.appendChild(btn);
});

// ── NUMÉROTATION AUTO ────────────────────────────────────────
function computeNumbers(grid) {
  const rows = grid.length, cols = grid[0].length;
  const nums = Array.from({length: rows}, () => Array(cols).fill(0));
  let n = 1;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (grid[r][c] === '#') continue;
      const acrossStart = (c === 0 || grid[r][c-1] === '#') && c+1 < cols && grid[r][c+1] !== '#';
      const downStart   = (r === 0 || grid[r-1][c] === '#') && r+1 < rows && grid[r+1][c] !== '#';
      if (acrossStart || downStart) nums[r][c] = n++;
    }
  }
  return nums;
}

// ── CONSTRUCTION GRILLE ───────────────────────────────────────
function buildGrid(idx) {
  const g    = GRIDS[idx];
  const grid = g.grid;
  const rows = grid.length, cols = grid[0].length;
  const nums = computeNumbers(grid);

  document.getElementById('grid-title').textContent = g.theme;
  document.getElementById('result-msg').textContent = '';
  document.getElementById('result-msg').className   = 'result-msg';
  document.getElementById('share-btn').className    = 'share-btn';

  inputMap = [];
  const table = document.getElementById('cw-table');
  table.innerHTML = '';

  for (let r = 0; r < rows; r++) {
    inputMap[r] = [];
    const tr = document.createElement('tr');
    for (let c = 0; c < cols; c++) {
      const td = document.createElement('td');
      if (grid[r][c] === '#') {
        td.className = 'black';
        inputMap[r][c] = null;
      } else {
        if (nums[r][c]) {
          const sp = document.createElement('span');
          sp.className = 'cell-num';
          sp.textContent = nums[r][c];
          td.appendChild(sp);
        }
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.maxLength = 1;
        inp.dataset.r   = r;
        inp.dataset.c   = c;
        inp.dataset.ans = grid[r][c];

        inp.addEventListener('keydown', onKeyDown);
        inp.addEventListener('input',   onInput);
        inp.addEventListener('focus',   () => onFocus(r, c));

        td.appendChild(inp);
        inputMap[r][c] = inp;
      }
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }

  buildClues(g, nums);
  activeDir = 'across';
  activeClueNum = null;
}

// ── CONSIGNES ─────────────────────────────────────────────────
function buildClues(g, nums) {
  const col = document.getElementById('clues-col');
  col.innerHTML = '';
  ['across','down'].forEach(dir => {
    const h = document.createElement('h3');
    h.textContent = dir === 'across' ? '→ across' : '↓ down';
    col.appendChild(h);
    const ul = document.createElement('ul');
    ul.className = 'clue-list';
    (g.clues[dir] || []).forEach(cl => {
      const li = document.createElement('li');
      li.dataset.num = cl.num;
      li.dataset.dir = dir;
      li.innerHTML = `<span>${cl.num}.</span><span>${cl.clue}</span>`;
      li.onclick = () => jumpToClue(cl.num, dir, nums);
      ul.appendChild(li);
    });
    col.appendChild(ul);
  });
}

function highlightClue(num, dir) {
  document.querySelectorAll('.clue-list li').forEach(li => {
    li.classList.toggle('active-clue',
      parseInt(li.dataset.num) === num && li.dataset.dir === dir);
  });
  // Scroll la consigne active dans la vue
  const active = document.querySelector('.clue-list li.active-clue');
  if (active) active.scrollIntoView({block:'nearest', behavior:'smooth'});
}

// ── NAVIGATION CLAVIER ────────────────────────────────────────
function onFocus(r, c) {
  // Déterminer la direction et le mot courant
  const g    = GRIDS[currentGrid];
  const grid = g.grid;
  const nums = computeNumbers(grid);

  // Chercher dans quelle(s) direction(s) cette case appartient
  const inAcross = canGoDir(grid, r, c, 'across');
  const inDown   = canGoDir(grid, r, c, 'down');

  if (inAcross && !inDown) activeDir = 'across';
  else if (!inAcross && inDown) activeDir = 'down';
  // sinon garde la direction courante

  buildSequence(grid, nums, r, c, activeDir);
  highlightCurrentWord(grid, nums, r, c, activeDir);
}

function canGoDir(grid, r, c, dir) {
  if (dir === 'across') {
    const rows = grid.length, cols = grid[0].length;
    return (c > 0 && grid[r][c-1] !== '#') || (c < cols-1 && grid[r][c+1] !== '#');
  } else {
    const rows = grid.length;
    return (r > 0 && grid[r-1][c] !== '#') || (r < rows-1 && grid[r+1][c] !== '#');
  }
}

function buildSequence(grid, nums, r, c, dir) {
  const rows = grid.length, cols = grid[0].length;
  // Trouver le début du mot
  let sr = r, sc = c;
  if (dir === 'across') { while (sc > 0 && grid[sr][sc-1] !== '#') sc--; }
  else                  { while (sr > 0 && grid[sr-1][sc] !== '#') sr--; }

  cellSequence = [];
  let cr = sr, cc = sc;
  while (cr < rows && cc < cols && grid[cr][cc] !== '#') {
    if (inputMap[cr] && inputMap[cr][cc]) cellSequence.push(inputMap[cr][cc]);
    if (dir === 'across') cc++; else cr++;
  }

  // Trouver le numéro de la consigne active
  if (nums[sr][sc]) {
    activeClueNum = nums[sr][sc];
    highlightClue(activeClueNum, dir);
  }
}

function highlightCurrentWord(grid, nums, r, c, dir) {
  // Reset toutes les cases
  document.querySelectorAll('.cw-table input').forEach(inp => {
    inp.classList.remove('selected');
  });
  // Surligner le mot courant
  cellSequence.forEach(inp => inp.classList.add('selected'));
  // La case active brille plus fort via :focus
}

function onInput(e) {
  const inp = e.target;
  const val = inp.value.toUpperCase().replace(/[^A-ZÀÂÄÉÈÊËÎÏÔÙÛÜÇ]/g,'');
  inp.value  = val.slice(-1);
  inp.classList.remove('correct', 'wrong');

  if (inp.value) {
    // Avancer vers la case suivante du mot
    const idx = cellSequence.indexOf(inp);
    if (idx !== -1 && idx < cellSequence.length - 1) {
      cellSequence[idx + 1].focus();
    }
  }
}

function onKeyDown(e) {
  const inp  = e.target;
  const r    = parseInt(inp.dataset.r);
  const c    = parseInt(inp.dataset.c);
  const grid = GRIDS[currentGrid].grid;
  const rows = grid.length, cols = grid[0].length;

  if (e.key === 'Backspace') {
    if (inp.value === '') {
      // Reculer
      const idx = cellSequence.indexOf(inp);
      if (idx > 0) { cellSequence[idx-1].value = ''; cellSequence[idx-1].focus(); }
    } else {
      inp.value = '';
    }
    e.preventDefault();
    return;
  }

  if (e.key === 'ArrowRight' && r < rows && c+1 < cols && inputMap[r][c+1]) {
    activeDir = 'across';
    buildSequence(grid, computeNumbers(grid), r, c+1, 'across');
    inputMap[r][c+1].focus(); e.preventDefault();
  }
  if (e.key === 'ArrowLeft'  && c > 0 && inputMap[r][c-1]) {
    activeDir = 'across';
    buildSequence(grid, computeNumbers(grid), r, c-1, 'across');
    inputMap[r][c-1].focus(); e.preventDefault();
  }
  if (e.key === 'ArrowDown'  && r+1 < rows && inputMap[r+1] && inputMap[r+1][c]) {
    activeDir = 'down';
    buildSequence(grid, computeNumbers(grid), r+1, c, 'down');
    inputMap[r+1][c].focus(); e.preventDefault();
  }
  if (e.key === 'ArrowUp'    && r > 0 && inputMap[r-1] && inputMap[r-1][c]) {
    activeDir = 'down';
    buildSequence(grid, computeNumbers(grid), r-1, c, 'down');
    inputMap[r-1][c].focus(); e.preventDefault();
  }

  // Tab : changer de direction
  if (e.key === 'Tab') {
    e.preventDefault();
    activeDir = activeDir === 'across' ? 'down' : 'across';
    buildSequence(grid, computeNumbers(grid), r, c, activeDir);
    inp.focus();
  }
}

function jumpToClue(num, dir, nums) {
  activeDir = dir;
  // Trouver la case correspondant au numéro
  const grid = GRIDS[currentGrid].grid;
  for (let r = 0; r < grid.length; r++) {
    for (let c = 0; c < grid[0].length; c++) {
      if (nums[r][c] === num) {
        buildSequence(grid, nums, r, c, dir);
        if (inputMap[r][c]) inputMap[r][c].focus();
        return;
      }
    }
  }
}

// ── VÉRIFICATION ─────────────────────────────────────────────
function checkGrid() {
  const inputs = document.querySelectorAll('.cw-table input');
  let correct = 0, total = 0;
  inputs.forEach(inp => {
    total++;
    if (inp.value.toUpperCase() === inp.dataset.ans.toUpperCase()) {
      inp.classList.add('correct'); inp.classList.remove('wrong');
      correct++;
    } else if (inp.value) {
      inp.classList.add('wrong'); inp.classList.remove('correct');
    } else {
      inp.classList.remove('correct','wrong');
    }
  });

  const msg  = document.getElementById('result-msg');
  const share= document.getElementById('share-btn');

  if (correct === total) {
    msg.textContent = 'parfait ! grille complète — +' + (currentGrid + 1) * 10 + ' pts';
    msg.className   = 'result-msg win';
    share.className = 'share-btn show';

    if (!doneGrids.includes(currentGrid)) {
      doneGrids.push(currentGrid);
      localStorage.setItem('cw-done', JSON.stringify(doneGrids));
      score += (currentGrid + 1) * 10;
      localStorage.setItem('cw-score', score);
      document.getElementById('score-badge').textContent = score + ' pts';
      // Marquer l'onglet
      document.querySelectorAll('.tab')[currentGrid].classList.add('done');
    }
  } else {
    msg.textContent = correct + ' / ' + total + ' correct';
    msg.className   = 'result-msg';
    share.className = 'share-btn';
  }
}

// ── RESET ────────────────────────────────────────────────────
function resetGrid() {
  document.querySelectorAll('.cw-table input').forEach(inp => {
    inp.value = '';
    inp.classList.remove('correct','wrong','selected');
  });
  document.getElementById('result-msg').textContent = '';
  document.getElementById('result-msg').className   = 'result-msg';
  document.getElementById('share-btn').className    = 'share-btn';
}

// ── PARTAGE ──────────────────────────────────────────────────
function shareResult() {
  const g = GRIDS[currentGrid];
  const txt = `j'ai fini la grille niveau ${currentGrid + 1} — "${g.theme}" — sur Ana & Adrien the kompiuter 🎉\n${window.location.href}`;
  if (navigator.share) {
    navigator.share({ text: txt }).catch(() => fallbackCopy(txt));
  } else {
    fallbackCopy(txt);
  }
}

function fallbackCopy(txt) {
  navigator.clipboard.writeText(txt).then(() => {
    document.getElementById('result-msg').textContent = 'copied to clipboard — go share it bah !';
  }).catch(() => {
    prompt('copy this :', txt);
  });
}

buildGrid(0);
