<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crosswords — Ana & Adrien</title>
<link rel="stylesheet" href="style.css">
<style>
  body { background:var(--blanc); }

  .page-header {
    padding:28px 40px 16px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .page-header h1 { font-size:2rem; color:var(--bord); }
  .score-badge {
    font-size:.9rem; color:var(--bord);
    border:var(--trait) solid var(--bord); padding:6px 18px;
  }

  .grid-tabs {
    padding:0 40px 20px;
    display:flex; gap:6px; flex-wrap:wrap;
  }
  .tab {
    padding:7px 14px;
    border:var(--trait) solid var(--bord-l);
    background:transparent;
    font-family:'Patrick Hand',cursive; font-size:.82rem;
    cursor:pointer; color:var(--muted);
    transition:all .15s;
    display:flex; flex-direction:column; gap:2px; align-items:center;
  }
  .tab .tn { font-size:.82rem; }
  .tab .td { font-size:.62rem; color:var(--muted); }
  .tab.active,.tab:hover { background:var(--bord); color:var(--blanc); }
  .tab.active .td,.tab:hover .td { color:rgba(250,248,244,.6); }
  .tab.done .tn::before { content:'✓ '; }

  .game-area {
    display:grid;
    grid-template-columns:3fr 1fr;
    gap:0;
    padding:0 40px 40px;
  }

  .grid-col {
    display:flex; flex-direction:column; align-items:center;
    overflow-x:auto;
  }

  .grid-title {
    font-size:1rem; color:var(--bord);
    margin-bottom:16px; text-align:center;
  }

  .cw-table { border-collapse:collapse; }
  .cw-table td {
    width:var(--cw-cell, 40px); height:var(--cw-cell, 40px);
    border:var(--trait) solid var(--bord-l);
    position:relative; text-align:center; padding:0;
  }
  .cw-table td.blk { background:var(--bord); border-color:var(--bord); }
  .cw-table td input {
    width:100%; height:100%; border:none; background:transparent;
    text-align:center;
    font-family:'Patrick Hand',cursive; font-size:1.1rem; font-weight:bold;
    color:var(--text); text-transform:uppercase; outline:none; cursor:pointer;
    caret-color:transparent;
  }
  .cw-table td input:focus { background:rgba(139,26,43,.08); }
  .cw-table td input.ok  { background:var(--bord); color:var(--blanc); }
  .cw-table td input.bad { background:rgba(139,26,43,.15); color:var(--bord); }
  .cw-table td input.sel { background:rgba(139,26,43,.12); }
  .cn {
    position:absolute; top:2px; left:3px;
    font-size:8px; color:var(--muted);
    pointer-events:none; line-height:1;
    font-family:'Patrick Hand',cursive;
  }

  .game-actions {
    margin-top:18px;
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
  }

  .result-msg {
    margin-top:12px; font-size:.95rem;
    color:var(--muted); text-align:center; min-height:22px;
  }
  .result-msg.win { color:var(--bord); font-size:1.05rem; }

  .share-btn {
    display:none; margin-top:8px;
    padding:10px 24px;
    background:transparent; border:var(--trait) solid var(--bord);
    font-family:'Patrick Hand',cursive; font-size:.9rem;
    color:var(--bord); cursor:pointer; transition:all .15s;
  }
  .share-btn:hover { background:var(--bord); color:var(--blanc); }
  .share-btn.show { display:inline-block; }

  .clues-col {
    padding-left:24px;
    border-left:var(--trait) solid var(--bord-l);
    font-size:.85rem;
    overflow-y:auto; max-height:80vh;
  }
  .clues-col h3 {
    font-size:.88rem; color:var(--bord);
    margin:0 0 8px; padding-bottom:4px;
    border-bottom:1px solid var(--bord-l);
  }
  .clues-col h3:not(:first-child) { margin-top:18px; }
  .clue-list { list-style:none; }
  .clue-list li {
    display:flex; gap:8px;
    padding:4px 0; line-height:1.4;
    border-bottom:1px solid var(--bord-l);
    color:var(--text); cursor:pointer; transition:color .15s;
  }
  .clue-list li:hover { color:var(--bord); }
  .clue-list li.hi { color:var(--bord); font-weight:bold; }
  .clue-list li span:first-child {
    color:var(--bord); min-width:20px; flex-shrink:0; font-size:.78rem;
  }

  /* ── MODAL SOLUTION ── */
  .sol-overlay {
    display:none; position:fixed; inset:0;
    background:rgba(250,248,244,.92);
    backdrop-filter:blur(6px); z-index:300;
    align-items:center; justify-content:center;
  }
  .sol-overlay.active { display:flex; }

  .sol-screen {
    display:none; flex-direction:column;
    align-items:center; justify-content:center;
    gap:24px; text-align:center; padding:40px;
    animation:pu .3s ease;
  }
  @keyframes pu { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .sol-screen.active { display:flex; }

  .sol-img {
    width:min(50vw,260px); height:min(50vw,260px);
    border:2px dashed var(--bord); opacity:.2;
    display:flex; align-items:center; justify-content:center;
    font-size:.8rem; color:var(--bord);
  }
  .sol-img img { width:100%; height:100%; object-fit:contain; opacity:1; }

  .sol-txt { font-size:clamp(1.6rem,5vw,3rem); color:var(--bord); line-height:1.2; }
  .sol-sub { font-size:.95rem; color:var(--muted); }

  .sol-grid-wrap { overflow:auto; max-width:88vw; max-height:60vh; }
  .sol-grid-wrap table { border-collapse:collapse; }
  .sol-grid-wrap td {
    width:var(--sol-cell, 34px); height:var(--sol-cell, 34px);
    border:var(--trait) solid var(--bord-l);
    text-align:center;
    font-family:'Patrick Hand',cursive; font-size:.95rem; font-weight:bold;
    color:var(--bord);
  }
  .sol-grid-wrap td.sblk { background:var(--bord); border-color:var(--bord); }
  .sol-grid-wrap .sn {
    display:block; font-size:7px; color:var(--muted);
    line-height:1; text-align:left; padding-left:2px; font-weight:normal;
  }

  .sol-close {
    margin-top:4px; font-size:.82rem; color:var(--muted);
    background:none; border:none;
    font-family:'Patrick Hand',cursive;
    cursor:pointer; text-decoration:underline;
  }
  .sol-close:hover { color:var(--bord); }

  @media(max-width:700px) {
    .game-area { grid-template-columns:1fr; }
    .clues-col { border-left:none; border-top:var(--trait) solid var(--bord-l); padding:16px 0 0; max-height:none; }
  }
</style>
</head>

//  ÉTAT
// ════════════════════════════════════════════════════════
var currentGrid  = 0;
var score        = parseInt(localStorage.getItem('cw-score') || '0');
var doneGrids    = JSON.parse(localStorage.getItem('cw-done') || '[]');
var inputMap     = [];
var cellSeq      = [];
var activeDir    = 'across';
var activeNum    = null;

document.getElementById('score-badge').textContent = score + ' pts';

// ── ONGLETS ──────────────────────────────────────────────────
var tabsEl = document.getElementById('grid-tabs');
GRIDS.forEach(function(g, i) {
  var btn = document.createElement('button');
  btn.className = 'tab' + (i===0?' active':'') + (doneGrids.indexOf(i)>=0?' done':'');
  btn.innerHTML = '<span class="tn">'+g.name+'</span><span class="td">'+Array(g.diff+1).join('·')+'</span>';
  btn.onclick = function() {
    currentGrid = i;
    buildGrid(i);
    document.querySelectorAll('.tab').forEach(function(t,j){ t.classList.toggle('active',j===i); });
  };
  tabsEl.appendChild(btn);
});

// ── NUMÉROTATION ─────────────────────────────────────────────
function computeNums(grid) {
  var rows=grid.length, cols=grid[0].length;
  var nums=[];
  for(var r=0;r<rows;r++){ nums.push([]); for(var c=0;c<cols;c++) nums[r].push(0); }
  var n=1;
  for(var r=0;r<rows;r++) {
    for(var c=0;c<cols;c++) {
      if(grid[r][c]==='#') continue;
      var a=(c===0||grid[r][c-1]==='#')&&c+1<cols&&grid[r][c+1]!=='#';
      var d=(r===0||grid[r-1][c]==='#')&&r+1<rows&&grid[r+1][c]!=='#';
      if(a||d) nums[r][c]=n++;
    }
  }
  return nums;
}

// ── CONSTRUIRE LA GRILLE ─────────────────────────────────────
function buildGrid(idx) {
  var g=GRIDS[idx], grid=g.grid;
  var rows=grid.length, cols=grid[0].length;
  var nums=computeNums(grid);

  var cellSize = cols > 18 ? 30 : (cols > 15 ? 34 : 40);
  document.documentElement.style.setProperty('--cw-cell', cellSize + 'px');
  document.documentElement.style.setProperty('--sol-cell', Math.max(24, cellSize - 6) + 'px');

  document.getElementById('grid-title').textContent = g.theme;
  document.getElementById('result-msg').textContent = '';
  document.getElementById('result-msg').className = 'result-msg';
  document.getElementById('share-btn').className = 'share-btn';

  inputMap=[];
  var table=document.getElementById('cw-table');
  table.innerHTML='';

  for(var r=0;r<rows;r++) {
    inputMap.push([]);
    var tr=document.createElement('tr');
    for(var c=0;c<cols;c++) {
      var td=document.createElement('td');
      if(grid[r][c]==='#') {
        td.className='blk';
        inputMap[r].push(null);
      } else {
        if(nums[r][c]) {
          var sp=document.createElement('span');
          sp.className='cn'; sp.textContent=nums[r][c];
          td.appendChild(sp);
        }
        var inp=document.createElement('input');
        inp.type='text'; inp.maxLength=1;
        inp.dataset.r=r; inp.dataset.c=c; inp.dataset.ans=grid[r][c];
        (function(rr,cc){ 
          inp.addEventListener('keydown',function(e){ onKey(e,rr,cc); });
          inp.addEventListener('input',  function(e){ onInp(e,rr,cc); });
          inp.addEventListener('focus',  function()  { onFoc(rr,cc); });
        })(r,c);
        td.appendChild(inp);
        inputMap[r].push(inp);
      }
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }

  buildClues(g, nums);
  activeDir='across'; activeNum=null;
}

// ── CONSIGNES ────────────────────────────────────────────────
function buildClues(g, nums) {
  var col=document.getElementById('clues-col');
  col.innerHTML='';
  ['across','down'].forEach(function(dir) {
    if(!g.clues[dir]||g.clues[dir].length===0) return;
    var h=document.createElement('h3');
    h.textContent=dir==='across'?'→ across':'↓ down';
    col.appendChild(h);
    var ul=document.createElement('ul'); ul.className='clue-list';
    g.clues[dir].forEach(function(cl) {
      var li=document.createElement('li');
      li.dataset.num=cl.num; li.dataset.dir=dir;
      li.innerHTML='<span>'+cl.num+'.</span><span>'+cl.clue+'</span>';
      li.onclick=function(){ jumpTo(cl.num, dir, computeNums(GRIDS[currentGrid].grid)); };
      ul.appendChild(li);
    });
    col.appendChild(ul);
  });
}

function hiClue(num, dir) {
  document.querySelectorAll('.clue-list li').forEach(function(li) {
    li.classList.toggle('hi', parseInt(li.dataset.num)===num && li.dataset.dir===dir);
  });
  var a=document.querySelector('.clue-list li.hi');
  if(a) a.scrollIntoView({block:'nearest',behavior:'smooth'});
}

// ── NAVIGATION ───────────────────────────────────────────────
function canDir(grid, r, c, dir) {
  var rows=grid.length, cols=grid[0].length;
  if(dir==='across') return (c>0&&grid[r][c-1]!=='#')||(c+1<cols&&grid[r][c+1]!=='#');
  return (r>0&&grid[r-1][c]!=='#')||(r+1<rows&&grid[r+1][c]!=='#');
}

function buildSeq(grid, nums, r, c, dir) {
  var rows=grid.length, cols=grid[0].length;
  var sr=r, sc=c;
  if(dir==='across') { while(sc>0&&grid[sr][sc-1]!=='#') sc--; }
  else               { while(sr>0&&grid[sr-1][sc]!=='#') sr--; }
  cellSeq=[];
  var cr=sr, cc=sc;
  while(cr<rows&&cc<cols&&grid[cr][cc]!=='#') {
    if(inputMap[cr]&&inputMap[cr][cc]) cellSeq.push(inputMap[cr][cc]);
    if(dir==='across') cc++; else cr++;
  }
  if(nums[sr][sc]) { activeNum=nums[sr][sc]; hiClue(activeNum, dir); }
}

function hiWord() {
  document.querySelectorAll('.cw-table input').forEach(function(i){ i.classList.remove('sel'); });
  cellSeq.forEach(function(i){ i.classList.add('sel'); });
}

function onFoc(r, c) {
  var grid=GRIDS[currentGrid].grid;
  var nums=computeNums(grid);
  var ia=canDir(grid,r,c,'across'), id=canDir(grid,r,c,'down');
  if(ia&&!id) activeDir='across';
  else if(!ia&&id) activeDir='down';
  buildSeq(grid,nums,r,c,activeDir);
  hiWord();
}

function onInp(e, r, c) {
  var inp=e.target;
  var v=inp.value.toUpperCase().replace(/[^A-ZÀÂÄÉÈÊËÎÏÔÙÛÜÇ]/g,'');
  inp.value=v.slice(-1);
  inp.classList.remove('ok','bad');
  if(inp.value) {
    var idx=cellSeq.indexOf(inp);
    if(idx!==-1&&idx<cellSeq.length-1) cellSeq[idx+1].focus();
  }
}

function onKey(e, r, c) {
  var inp=e.target;
  var grid=GRIDS[currentGrid].grid;
  var rows=grid.length, cols=grid[0].length;
  var nums=computeNums(grid);

  if(e.key==='Backspace') {
    if(inp.value==='') {
      var idx=cellSeq.indexOf(inp);
      if(idx>0){ cellSeq[idx-1].value=''; cellSeq[idx-1].focus(); }
    } else { inp.value=''; }
    e.preventDefault(); return;
  }
  if(e.key==='ArrowRight'&&c+1<cols&&inputMap[r][c+1]){ activeDir='across'; buildSeq(grid,nums,r,c+1,'across'); inputMap[r][c+1].focus(); e.preventDefault(); }
  if(e.key==='ArrowLeft' &&c>0    &&inputMap[r][c-1]){ activeDir='across'; buildSeq(grid,nums,r,c-1,'across'); inputMap[r][c-1].focus(); e.preventDefault(); }
  if(e.key==='ArrowDown' &&r+1<rows&&inputMap[r+1]&&inputMap[r+1][c]){ activeDir='down'; buildSeq(grid,nums,r+1,c,'down'); inputMap[r+1][c].focus(); e.preventDefault(); }
  if(e.key==='ArrowUp'   &&r>0    &&inputMap[r-1]&&inputMap[r-1][c]){ activeDir='down'; buildSeq(grid,nums,r-1,c,'down'); inputMap[r-1][c].focus(); e.preventDefault(); }
  if(e.key==='Tab'){ e.preventDefault(); activeDir=activeDir==='across'?'down':'across'; buildSeq(grid,nums,r,c,activeDir); inp.focus(); }
}

function jumpTo(num, dir, nums) {
  activeDir=dir;
  var grid=GRIDS[currentGrid].grid;
  for(var r=0;r<grid.length;r++) for(var c=0;c<grid[0].length;c++) {
    if(nums[r][c]===num){ buildSeq(grid,nums,r,c,dir); if(inputMap[r][c]) inputMap[r][c].focus(); return; }
  }
}

// ── VÉRIFIER ─────────────────────────────────────────────────
function checkGrid() {
  var inps=document.querySelectorAll('.cw-table input');
  var ok=0, tot=0;
  inps.forEach(function(inp) {
    tot++;
    if(inp.value.toUpperCase()===inp.dataset.ans.toUpperCase()){ inp.classList.add('ok'); inp.classList.remove('bad'); ok++; }
    else if(inp.value){ inp.classList.add('bad'); inp.classList.remove('ok'); }
    else { inp.classList.remove('ok','bad'); }
  });
  var msg=document.getElementById('result-msg'), sh=document.getElementById('share-btn');
  if(ok===tot) {
    msg.textContent='parfait ! grille complète — +'+(currentGrid+1)*10+' pts';
    msg.className='result-msg win'; sh.className='share-btn show';
    if(doneGrids.indexOf(currentGrid)<0) {
      doneGrids.push(currentGrid);
      localStorage.setItem('cw-done',JSON.stringify(doneGrids));
      score+=(currentGrid+1)*10;
      localStorage.setItem('cw-score',score);
      document.getElementById('score-badge').textContent=score+' pts';
      document.querySelectorAll('.tab')[currentGrid].classList.add('done');
    }
  } else {
    msg.textContent=ok+' / '+tot+' correct';
    msg.className='result-msg'; sh.className='share-btn';
  }
}

function resetGrid() {
  document.querySelectorAll('.cw-table input').forEach(function(i){ i.value=''; i.classList.remove('ok','bad','sel'); });
  document.getElementById('result-msg').textContent='';
  document.getElementById('result-msg').className='result-msg';
  document.getElementById('share-btn').className='share-btn';
}

// ── SOLUTION ─────────────────────────────────────────────────
function startSol() {
  ['sol1','sol2','sol3'].forEach(function(id){ document.getElementById(id).classList.remove('active'); });
  document.getElementById('sol1').classList.add('active');
  buildSolGrid();
  document.getElementById('sol-overlay').classList.add('active');
}

function solGo(n) {
  ['sol1','sol2','sol3'].forEach(function(id){ document.getElementById(id).classList.remove('active'); });
  document.getElementById('sol'+n).classList.add('active');
}

function closeSol() { document.getElementById('sol-overlay').classList.remove('active'); }

function buildSolGrid() {
  var g=GRIDS[currentGrid], grid=g.grid;
  var rows=grid.length, cols=grid[0].length;
  var nums=computeNums(grid);
  var wrap=document.getElementById('sol-grid-wrap'); wrap.innerHTML='';
  var table=document.createElement('table');
  for(var r=0;r<rows;r++) {
    var tr=document.createElement('tr');
    for(var c=0;c<cols;c++) {
      var td=document.createElement('td');
      if(grid[r][c]==='#') { td.className='sblk'; }
      else {
        if(nums[r][c]){ var s=document.createElement('span'); s.className='sn'; s.textContent=nums[r][c]; td.appendChild(s); }
        td.appendChild(document.createTextNode(grid[r][c]));
      }
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }
  wrap.appendChild(table);
}

function applySol() {
  var g=GRIDS[currentGrid], grid=g.grid;
  for(var r=0;r<grid.length;r++) for(var c=0;c<grid[0].length;c++) {
    if(inputMap[r]&&inputMap[r][c]&&grid[r][c]!=='#'){ inputMap[r][c].value=grid[r][c]; inputMap[r][c].classList.add('ok'); inputMap[r][c].classList.remove('bad'); }
  }
  closeSol();
  document.getElementById('result-msg').textContent='voilà. pas de jugement, bah.';
}

// ── PARTAGE ──────────────────────────────────────────────────
function shareResult() {
  var g=GRIDS[currentGrid];
  var txt="j'ai fini la grille niveau "+(currentGrid+1)+" — \""+g.theme+"\" — sur Ana & Adrien the kompiuter\n"+window.location.href;
  if(navigator.share) { navigator.share({text:txt}).catch(function(){ fallbackCopy(txt); }); }
  else fallbackCopy(txt);
}
function fallbackCopy(txt) {
  navigator.clipboard.writeText(txt).then(function(){ document.getElementById('result-msg').textContent='copied — go share it bah !'; }).catch(function(){ prompt('copy this:',txt); });
}

// ── INIT ─────────────────────────────────────────────────────
buildGrid(0);
