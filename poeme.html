<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poèmes — Ana & Adrien</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --sienna:  #8C3A1E;
    --sienna-d:#5C220C;
    --vert:    #2E4600;
    --beige:   #F5EFE4;
    --beige-2: #EDE3D0;
    --beige-3: #E0D3BA;
    --beige-4: #C8B89A;
    --text:    #2A1A0E;
    --muted:   #7A5C3E;
    --panel-w: 340px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--beige);
    font-family: 'Cormorant Garamond', serif;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content:'';
    position:fixed; top:0; left:0; right:0;
    height:3px; background:var(--vert); z-index:20;
  }

  /* ── NAV ── */
  .nav {
    padding: 28px 36px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative; z-index:10;
  }

  .back-btn {
    text-decoration:none;
    font-size: 0.68rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    transition: color 0.18s;
  }
  .back-btn:hover { color: var(--sienna); }

  .nav-title {
    font-size: 0.68rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ── LAYOUT ── */
  /* Le contenu principal se décale quand le panneau est ouvert */
  .stage {
    display: flex;
    min-height: calc(100vh - 80px);
    transition: transform 0.5s cubic-bezier(0.77,0,0.18,1);
  }

  .main {
    flex: 1;
    min-width: 0;
    padding: 0 0 100px;
    transition: transform 0.5s cubic-bezier(0.77,0,0.18,1);
  }

  /* ── HERO POÈME ── */
  .poem-hero {
    max-width: 600px;
    margin: 0 auto;
    padding: 8px 40px 56px;
    position: relative;
  }

  .poem-meta {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 36px;
  }

  .poem-lang {
    font-size: 0.65rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .poem-counter {
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    color: var(--beige-4);
  }

  .poem-lang-bar {
    flex:1; height:1px; background:var(--beige-3);
  }

  .poem-title {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 300;
    font-style: italic;
    color: var(--sienna-d);
    line-height: 1.15;
    margin-bottom: 6px;
  }

  .poem-author {
    font-size: 0.78rem;
    letter-spacing: 0.14em;
    color: var(--muted);
    margin-bottom: 40px;
    text-transform: uppercase;
  }

  .poem-body {
    font-size: clamp(1.05rem, 2vw, 1.2rem);
    font-weight: 300;
    line-height: 2;
    color: var(--text);
    white-space: pre-line;
    border-left: 1.5px solid var(--beige-3);
    padding-left: 28px;
  }

  /* ── ACTIONS ── */
  .poem-actions {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-top: 52px;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    padding: 0 40px;
  }

  .btn-prev, .btn-next {
    background: none;
    border: none;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    padding: 6px 0;
    transition: color 0.18s;
  }
  .btn-prev:hover, .btn-next:hover { color: var(--sienna); }
  .btn-prev { border-bottom: 1px solid var(--beige-3); }
  .btn-next { border-bottom: 1px solid var(--beige-3); margin-left: auto; }

  .btn-random {
    background: var(--sienna);
    color: var(--beige);
    border: none;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 10px 28px;
    cursor: pointer;
    transition: background 0.18s;
  }
  .btn-random:hover { background: var(--sienna-d); }

  /* ── LISTE POÈMES ── */
  .poem-list-wrap {
    max-width: 600px;
    margin: 0 auto;
    padding: 0 40px;
  }

  .list-rule {
    display:flex; align-items:center; gap:16px; margin-bottom:20px;
  }
  .list-rule span {
    font-size:0.65rem; letter-spacing:0.22em;
    text-transform:uppercase; color:var(--muted); white-space:nowrap;
  }
  .list-rule::before, .list-rule::after {
    content:''; flex:1; height:1px; background:var(--beige-3);
  }

  .poem-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
  }

  @media (max-width: 480px) { .poem-list { grid-template-columns: 1fr; } }

  .poem-item {
    background: var(--beige-2);
    padding: 18px 16px;
    cursor: pointer;
    transition: background 0.18s;
    display: flex;
    flex-direction: column;
    gap: 4px;
    border: none;
    font-family: 'Cormorant Garamond', serif;
    text-align: left;
  }
  .poem-item:hover, .poem-item.active {
    background: var(--sienna);
  }
  .poem-item:hover .pi-title, .poem-item.active .pi-title { color: var(--beige); }
  .poem-item:hover .pi-author, .poem-item.active .pi-author { color: rgba(245,239,228,0.55); }
  .poem-item:hover .pi-lang, .poem-item.active .pi-lang { color: rgba(245,239,228,0.4); }

  .pi-lang {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--beige-4);
    transition: color 0.18s;
  }
  .pi-title {
    font-size: 0.95rem;
    font-style: italic;
    color: var(--text);
    line-height: 1.3;
    transition: color 0.18s;
  }
  .pi-author {
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    transition: color 0.18s;
  }

  /* ── PANNEAU LATÉRAL ── */
  .side-panel {
    position: fixed;
    top: 0; right: 0;
    width: var(--panel-w);
    height: 100vh;
    background: var(--sienna-d);
    color: var(--beige);
    transform: translateX(100%);
    transition: transform 0.5s cubic-bezier(0.77,0,0.18,1);
    z-index: 50;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .side-panel.open {
    transform: translateX(0);
  }

  .panel-header {
    padding: 36px 32px 24px;
    border-bottom: 1px solid rgba(245,239,228,0.12);
    flex-shrink: 0;
  }

  .panel-close {
    display: block;
    font-size: 0.62rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(245,239,228,0.45);
    background: none;
    border: none;
    font-family: 'Cormorant Garamond', serif;
    cursor: pointer;
    padding: 0 0 20px;
    transition: color 0.18s;
    text-align: left;
  }
  .panel-close:hover { color: var(--beige); }

  .panel-subtitle {
    font-size: 0.62rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(245,239,228,0.35);
    margin-bottom: 10px;
  }

  .panel-poem-title {
    font-size: 1.4rem;
    font-style: italic;
    font-weight: 300;
    color: var(--beige);
    line-height: 1.2;
  }

  .panel-body {
    padding: 32px;
    flex: 1;
  }

  .anecdote-block {
    margin-bottom: 32px;
  }

  .anec-label {
    font-size: 0.6rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(245,239,228,0.35);
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(245,239,228,0.1);
  }

  .anec-text {
    font-size: 0.98rem;
    font-weight: 300;
    line-height: 1.75;
    color: rgba(245,239,228,0.82);
  }

  /* Bouton "En savoir plus" flottant */
  .panel-toggle {
    position: fixed;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    background: var(--sienna-d);
    color: var(--beige);
    border: none;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.62rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    padding: 18px 10px;
    cursor: pointer;
    z-index: 49;
    transition: background 0.18s, opacity 0.3s;
    opacity: 1;
  }

  .panel-toggle:hover { background: var(--sienna); }
  .panel-toggle.hidden { opacity: 0; pointer-events: none; }

  /* Overlay fond sombre quand panneau ouvert */
  .overlay {
    display: none;
    position: fixed; inset:0;
    background: rgba(42,26,14,0.35);
    z-index: 40;
  }
  .overlay.active { display: block; }

  /* Animation entrée poème */
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(12px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .poem-hero { animation: fadeUp 0.45s ease; }

  /* Scrollbar panneau */
  .side-panel::-webkit-scrollbar { width: 4px; }
  .side-panel::-webkit-scrollbar-thumb { background: rgba(245,239,228,0.15); border-radius:2px; }
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="back-btn">← Retour</a>
  <div class="nav-title">Poèmes</div>
  <div style="width:80px"></div>
</nav>

<div class="stage">
  <div class="main" id="main">

    <!-- POÈME AFFICHÉ -->
    <div class="poem-hero" id="poem-hero">
      <div class="poem-meta">
        <div class="poem-lang" id="poem-lang">Français</div>
        <div class="poem-lang-bar"></div>
        <div class="poem-counter" id="poem-counter">01 / 20</div>
      </div>
      <div class="poem-title"  id="poem-title"></div>
      <div class="poem-author" id="poem-author"></div>
      <div class="poem-body"   id="poem-body"></div>
    </div>

    <div class="poem-actions">
      <button class="btn-prev" onclick="navigate(-1)">Précédent</button>
      <button class="btn-random" onclick="goRandom()">Au hasard</button>
      <button class="btn-next" onclick="navigate(1)">Suivant</button>
    </div>

    <div style="height:56px"></div>

    <!-- LISTE -->
    <div class="poem-list-wrap">
      <div class="list-rule"><span>Tous les poèmes</span></div>
      <div class="poem-list" id="poem-list"></div>
    </div>

  </div>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay" onclick="closePanel()"></div>

<!-- Bouton latéral -->
<button class="panel-toggle" id="panel-toggle" onclick="openPanel()">En savoir plus</button>

<!-- Panneau latéral -->
<div class="side-panel" id="side-panel">
  <div class="panel-header">
    <button class="panel-close" onclick="closePanel()">Fermer ×</button>
    <div class="panel-subtitle">À propos du poème</div>
    <div class="panel-poem-title" id="panel-poem-title"></div>
  </div>
  <div class="panel-body" id="panel-body"></div>
</div>

<script>
// ══════════════════════════════════════════════════════
//  BASE DE DONNÉES — 20 POÈMES
// ══════════════════════════════════════════════════════
const POEMS = [

  // ── FRANÇAIS (10) ────────────────────────────────────

  {
    lang: "fr", langLabel: "Français",
    title: "Demain, dès l'aube",
    author: "Victor Hugo",
    year: "1856",
    text: `Demain, dès l'aube, à l'heure où blanchit la campagne,
Je partirai. Vois-tu, je sais que tu m'attends.
J'irai par la forêt, j'irai par la montagne.
Je ne puis demeurer loin de toi plus longtemps.

Je marcherai les yeux fixés sur mes pensées,
Sans rien voir au dehors, sans entendre aucun bruit,
Seul, inconnu, le dos courbé, les mains croisées,
Triste, et le jour pour moi sera comme la nuit.

Et quand j'arriverai, je mettrai sur ta tombe
Un bouquet de houx vert et de bruyère en fleur.`,
    anecdotes: [
      {
        label: "Contexte",
        text: "Hugo écrit ce poème en 1847 après la mort accidentelle de sa fille Léopoldine, noyée dans la Seine avec son mari. Le lecteur comprend en fin de poème que le voyage décrit n'est pas un voyage vers la vie, mais vers une tombe."
      },
      {
        label: "La ruse du poème",
        text: "Hugo dissimule savamment le deuil jusqu'au dernier vers. Les deux premières strophes laissent croire à un voyage amoureux. C'est le mot « tombe » au dernier vers qui fait tout basculer — une des fins les plus bouleversantes de la poésie française."
      },
      {
        label: "Victor Hugo",
        text: "Hugo (1802-1885) est l'une des figures tutélaires du romantisme français. Chef de file littéraire, homme politique engagé, exilé volontaire sous Napoléon III, auteur des Misérables et de Notre-Dame de Paris."
      }
    ]
  },

  {
    lang: "fr", langLabel: "Français",
    title: "Le Bonheur",
    author: "Paul Verlaine",
    year: "1881",
    text: `Le ciel est, par-dessus le toit,
Si bleu, si calme !
Un arbre, par-dessus le toit,
Berce sa palme.

La cloche, dans le ciel qu'on voit,
Doucement tinte.
Un oiseau sur l'arbre qu'on voit
Chante sa plainte.

Mon Dieu, mon Dieu, la vie est là,
Simple et tranquille.
Cette paisible rumeur-là
Vient de la ville.

— Qu'as-tu fait, ô toi que voilà
Pleurant sans cesse,
Dis, qu'as-tu fait, toi que voilà,
De ta jeunesse ?`,
    anecdotes: [
      {
        label: "Contexte",
        text: "Verlaine écrit ce poème depuis la prison de Mons (Belgique) en 1873, où il purge une peine de deux ans après avoir blessé Arthur Rimbaud d'un coup de pistolet. Ce qu'il aperçoit par sa cellule — un carré de ciel, un arbre, une cloche — devient le symbole amer d'une liberté perdue."
      },
      {
        label: "La forme",
        text: "La structure en octosyllabes répétés (le même vers revient modifié) crée un effet d'écho mélancolique, comme si le poète ressassait ses regrets. Le dernier quatrain rompt le charme et s'adresse à lui-même avec une cruauté douce."
      },
      {
        label: "Verlaine & Rimbaud",
        text: "Leur relation tumultueuse est l'une des plus célèbres de l'histoire littéraire. Rimbaud avait 17 ans à leur rencontre ; leur aventure à travers l'Europe finit par ce coup de feu à Bruxelles. Rimbaud abandonnera la poésie peu après."
      }
    ]
  },

  {
    lang: "fr", langLabel: "Français",
    title: "L'Invitation au voyage",
    author: "Charles Baudelaire",
    year: "1857",
    text: `Mon enfant, ma sœur,
Songe à la douceur
D'aller là-bas vivre ensemble !
Aimer à loisir,
Aimer et mourir
Au pays qui te ressemble !

Les soleils mouillés
De ces ciels brouillés
Pour mon esprit ont les charmes
Si mystérieux
De tes traîtres yeux,
Brillant à travers leurs larmes.

Là, tout n'est qu'ordre et beauté,
Luxe, calme et volupté.`,
    anecdotes: [
      {
        label: "Le pays imaginaire",
        text: "Le poème décrit un pays idéal qui ressemble à la femme aimée — on pense aux Pays-Bas, à leurs canaux et ciels gris. Mais ce pays n'existe pas vraiment : c'est la Hollande rêvée, la femme idéalisée, une utopie du désir."
      },
      {
        label: "Le refrain parfait",
        text: "« Là, tout n'est qu'ordre et beauté, / Luxe, calme et volupté » est peut-être le vers le plus cité de Baudelaire. Sa musicalité vient d'une alternance savante d'alexandrins et d'hexasyllabes. Matisse s'en inspirera pour un tableau célèbre (1904)."
      },
      {
        label: "Les Fleurs du Mal",
        text: "Baudelaire (1821-1867) publie Les Fleurs du Mal en 1857 — recueil aussitôt censuré pour « outrage à la morale publique ». Six poèmes sont supprimés. Le procès contribue paradoxalement à sa célébrité. Il mourra à 46 ans, ruiné et malade."
      }
    ]
  },

  {
    lang: "fr", langLabel: "Français",
    title: "Green",
    author: "Paul Verlaine",
    year: "1874",
    text: `Voici des fruits, des fleurs, des feuilles et des branches,
Et puis voici mon cœur, qui ne bat que pour vous.
Ne le déchirez pas avec vos deux mains blanches
Et qu'à vos yeux si beaux l'humble présent soit doux.

J'arrive tout couvert encore de rosée
Que le vent du matin vient glacer à mon front.
Souffrez que ma fatigue, à vos pieds reposée,
Rêve des chers instants qui la délasseront.

Sur votre jeune sein laissez rouler ma tête
Toute sonore encore de vos derniers baisers ;
Laissez-la s'apaiser de la bonne tempête,
Et que je dorme un peu puisque vous reposez.`,
    anecdotes: [
      {
        label: "Dédié à Rimbaud",
        text: "Ce poème est adressé à Rimbaud dans la section Romances sans paroles. Il décrit l'arrivée d'un amant au petit matin, couvert de rosée, suppliant d'être accueilli. La tendresse et la vulnérabilité du poète y sont rares et touchantes."
      },
      {
        label: "Romances sans paroles",
        text: "Verlaine écrit ce recueil pendant leur fuite en Belgique et en Angleterre avec Rimbaud (1872-1873). Les poèmes sont délibérément musicaux, presque sans images fortes — Verlaine voulait une poésie proche de la chanson."
      },
      {
        label: "Le titre anglais",
        text: "Verlaine titrait parfois ses poèmes en anglais par fascination pour la culture britannique. Green renvoie à la fois à la couleur des fruits et feuilles offerts, et à la jeunesse — la green youth anglaise."
      }
    ]
  },

  {
    lang: "fr", langLabel: "Français",
    title: "Ma Bohème",
    author: "Arthur Rimbaud",
    year: "1870",
    text: `Je m'en allais, les poings dans mes poches crevées ;
Mon paletot aussi devenait idéal ;
J'allais sous le ciel, Muse ! et j'étais ton féal ;
Oh ! là ! là ! que d'amours splendides j'ai rêvées !

Mon unique culotte avait un large trou.
— Petit-Poucet rêveur, j'égrenais dans ma course
Des rimes. Mon auberge était à la Grande-Ourse.
— Mes étoiles au ciel avaient un doux frou-frou.

Et je les écoutais, assis au bord des routes,
Ces bons soirs de septembre où je sentais des gouttes
De rosée à mon front, comme un vin de vigueur ;

Où, rimant au milieu des ombres fantastiques,
Comme des lyres, je tirais les élastiques
De mes souliers blessés, un pied près de mon cœur !`,
    anecdotes: [
      {
        label: "Un adolescent fugitif",
        text: "Rimbaud écrit ce sonnet à 16 ans, lors de ses premières fugues à pied vers Paris depuis Charleville. Il n'a pas d'argent, ses chaussures sont trouées — il transforme sa misère en aventure poétique avec une joie insolente."
      },
      {
        label: "L'adieu à la poésie",
        text: "Rimbaud (1854-1891) abandonne définitivement la poésie à 21 ans, après Un Saison en Enfer. Il partira faire du commerce en Éthiopie et au Yémen, et ne publiera plus jamais. Ses œuvres complètes tiennent en moins de 300 pages."
      },
      {
        label: "La forme du sonnet brisé",
        text: "Le sonnet classique est ici malmené avec humour : Rimbaud alterne les registres, mélange le trivial (la culotte trouée) et le sublime (la Grande Ourse comme auberge). Cette liberté de ton est sa signature."
      }
    ]
  },

  {
    lang: "fr", langLabel: "Français",
    title: "Liberté",
    author: "Paul Éluard",
    year: "1942",
    text: `Sur mes cahiers d'écolier
Sur mon pupitre et les arbres
Sur le sable sur la neige
J'écris ton nom.

Sur toutes les pages lues
Sur toutes les pages blanches
Pierre sang papier ou cendre
J'écris ton nom.

Sur les images dorées
Sur les armes des guerriers
Sur la couronne des rois
J'écris ton nom.

Et par le pouvoir d'un mot
Je recommence ma vie
Je suis né pour te connaître
Pour te nommer :
Liberté.`,
    anecdotes: [
      {
        label: "Résistance et clandestinité",
        text: "Éluard écrit ce poème en 1942, sous l'Occupation nazie. Il est d'abord intitulé « Une seule pensée » et dédié à une femme. La Résistance le copie, le diffuse clandestinement, et la RAF le largue en tracts sur la France occupée."
      },
      {
        label: "Le mot final",
        text: "Le lecteur croit pendant 20 strophes que le poète écrit le nom d'une femme aimée. Le dernier mot — « Liberté » — est une révélation qui fait relire tout le poème autrement. C'est une des fins les plus puissantes de la poésie du XXe siècle."
      },
      {
        label: "Paul Éluard",
        text: "Éluard (1895-1952) est l'un des grands surréalistes français. Ami de Breton, Picasso et Dali, il s'engage dans le Parti communiste après la guerre. Sa poésie allie la clarté du langage à la profondeur du sentiment."
      }
    ]
  },

  {
    lang: "fr", langLabel: "Français",
    title: "Le Dormeur du Val",
    author: "Arthur Rimbaud",
    year: "1870",
    text: `C'est un trou de verdure où chante une rivière
Accrochant follement aux herbes des haillons
D'argent ; où le soleil, de la montagne fière,
Luit : c'est un petit val qui mousse de rayons.

Un soldat jeune, bouche ouverte, tête nue,
Et la nuque baignant dans le frais cresson bleu,
Dort ; il est étendu dans l'herbe, sous la nue,
Pâle dans son lit vert où la lumière pleut.

Sourirait un enfant malade, il fait un somme :

let current = 0;

// ── RENDU ─────────────────────────────────────────────
function renderPoem(idx) {
  current = ((idx % POEMS.length) + POEMS.length) % POEMS.length;
  const p = POEMS[current];
  const hero = document.getElementById('poem-hero');
  hero.style.opacity = 0;
  setTimeout(() => {
    document.getElementById('poem-lang').textContent   = p.langLabel;
    document.getElementById('poem-counter').textContent =
      String(current + 1).padStart(2, '0') + ' / ' + POEMS.length;
    document.getElementById('poem-title').textContent  = p.title;
    document.getElementById('poem-author').textContent =
      p.author + (p.year ? '  ·  ' + p.year : '');
    document.getElementById('poem-body').textContent   = p.text;
    hero.style.opacity = 1;
    hero.style.transition = 'opacity 0.4s';

    // Mettre à jour le panneau si ouvert
    if (document.getElementById('side-panel').classList.contains('open')) {
      renderPanel(current);
    }

    // Mettre à jour la liste
    document.querySelectorAll('.poem-item').forEach((el, i) => {
      el.classList.toggle('active', i === current);
    });

    // Scroll en haut
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, 200);
  hero.style.transition = 'opacity 0.2s';
}

// ── LISTE ─────────────────────────────────────────────
function buildList() {
  const list = document.getElementById('poem-list');
  POEMS.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'poem-item' + (i === 0 ? ' active' : '');
    btn.innerHTML =
      `<span class="pi-lang">${p.langLabel}</span>` +
      `<span class="pi-title">${p.title}</span>` +
      `<span class="pi-author">${p.author}</span>`;
    btn.onclick = () => { renderPoem(i); closePanel(); };
    list.appendChild(btn);
  });
}

// ── NAVIGATION ────────────────────────────────────────
function navigate(dir) { renderPoem(current + dir); }

function goRandom() {
  let idx;
  do { idx = Math.floor(Math.random() * POEMS.length); } while (idx === current);
  renderPoem(idx);
}

// ── PANNEAU LATÉRAL ───────────────────────────────────
function renderPanel(idx) {
  const p = POEMS[idx];
  document.getElementById('panel-poem-title').textContent = p.title + ' — ' + p.author;
  const body = document.getElementById('panel-body');
  body.innerHTML = p.anecdotes.map(a =>
    `<div class="anecdote-block">
       <div class="anec-label">${a.label}</div>
       <div class="anec-text">${a.text}</div>
     </div>`
  ).join('');
}

function openPanel() {
  renderPanel(current);
  document.getElementById('side-panel').classList.add('open');
  document.getElementById('overlay').classList.add('active');
  document.getElementById('panel-toggle').classList.add('hidden');
}

function closePanel() {
  document.getElementById('side-panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('active');
  document.getElementById('panel-toggle').classList.remove('hidden');
}

// ── INIT ──────────────────────────────────────────────
buildList();
renderPoem(Math.floor(Math.random() * POEMS.length));
</script>
</body>
</html>
