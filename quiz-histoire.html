<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trivia — Ana & Adrien</title>
<link rel="stylesheet" href="style.css">
<style>
  /* ── fallback variables (au cas où style.css n'est pas là) ── */
  :root{
    --bord:#8b1a2b; --bord-l:#e3d9cf; --blanc:#faf8f4;
    --text:#2c2622; --muted:#9a8f84; --trait:1.5px;
  }
  @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');
  body{ font-family:'Patrick Hand',cursive; background:var(--blanc); color:var(--text); margin:0; }
  .nav{ display:flex; align-items:center; justify-content:space-between; padding:14px 24px; border-bottom:var(--trait) solid var(--bord-l); }
  .nav-title{ color:var(--bord); font-size:1.1rem; }
  .back-btn{ color:var(--muted); text-decoration:none; font-size:.95rem; }
  .back-btn:hover{ color:var(--bord); }
  .btn{ font-family:'Patrick Hand',cursive; font-size:1rem; padding:11px 22px; border:var(--trait) solid var(--bord); background:transparent; color:var(--bord); cursor:pointer; transition:all .15s; }
  .btn:hover{ background:var(--bord); color:var(--blanc); }
  .btn-full{ width:100%; }
  footer{ text-align:center; padding:30px; color:var(--muted); font-size:.85rem; }

  .page-header { padding:28px 40px 8px; }
  .page-header h1 { font-size:2rem; color:var(--bord); margin:0; }
  .page-header p  { font-size:0.9rem; color:var(--muted); margin:6px 0 0; }

  /* ── onglets de thèmes ── */
  .theme-tabs{ padding:18px 40px 4px; display:flex; gap:6px; flex-wrap:wrap; }
  .ttab{
    padding:8px 14px; border:var(--trait) solid var(--bord-l); background:transparent;
    font-family:'Patrick Hand',cursive; font-size:.85rem; cursor:pointer; color:var(--muted);
    transition:all .15s; display:flex; flex-direction:column; gap:2px; align-items:center; min-width:74px;
  }
  .ttab .tn{ font-size:.86rem; }
  .ttab .td{ font-size:.62rem; color:var(--muted); }
  .ttab.active,.ttab:hover{ background:var(--bord); color:var(--blanc); }
  .ttab.active .td,.ttab:hover .td{ color:rgba(250,248,244,.6); }
  .ttab .em{ font-size:1.05rem; line-height:1; }
  .difflbl{ padding:2px 40px 4px; font-size:.78rem; color:var(--muted); }

  .quiz-wrap { max-width:600px; margin:0 auto; padding:24px 40px 80px; }

  .progress { height:3px; background:var(--bord-l); margin-bottom:8px; }
  .progress-fill { height:100%; background:var(--bord); transition:width .4s; }
  .progress-label { font-size:0.8rem; color:var(--muted); margin-bottom:24px; display:flex; justify-content:space-between; }

  .q-card { border:var(--trait) solid var(--bord-l); padding:28px; margin-bottom:20px; }
  .q-flag { font-size:1.4rem; margin-bottom:10px; }
  .q-text { font-size:1.15rem; color:var(--text); line-height:1.5; }

  .choices { display:flex; flex-direction:column; gap:8px; margin-top:24px; }
  .choice {
    padding:13px 18px; border:var(--trait) solid var(--bord-l);
    background:transparent; text-align:left;
    font-family:'Patrick Hand',cursive; font-size:1rem;
    cursor:pointer; color:var(--text); transition:all .15s;
  }
  .choice:hover:not(:disabled) { border-color:var(--bord); background:var(--bord-l); }
  .choice.correct { background:var(--bord); color:var(--blanc); border-color:var(--bord); }
  .choice.wrong   { background:var(--bord-l); color:var(--bord); border-color:var(--bord); text-decoration:line-through; }
  .choice:disabled { cursor:default; }

  .feedback { padding:14px 18px; border-left:var(--trait) solid var(--bord); font-size:0.95rem; color:var(--muted); margin-top:8px; display:none; line-height:1.6; }
  .feedback.show { display:block; }

  .btn-next { margin-top:20px; display:none; }
  .btn-next.show { display:inline-block; }

  /* Score */
  .score-screen { display:none; text-align:center; padding:50px 40px; }
  .score-screen.show { display:block; }
  .score-num { font-size:5rem; color:var(--bord); line-height:1; }
  .score-msg { font-size:1.1rem; color:var(--muted); margin:16px 0 8px; }
  .score-best { font-size:.9rem; color:var(--muted); margin-bottom:32px; }
  .score-actions{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-width:360px; margin:0 auto; }
</style>
</head>
<body>
<nav class="nav">
  <a href="index.html" class="back-btn">← retour</a>
  <div class="nav-title">Trivia</div>
  <div></div>
</nav>

<div class="page-header">
  <h1>Trivia</h1>
  <p>choisis un thème — et accroche-toi, c'est pas donné</p>
</div>

<div class="theme-tabs" id="theme-tabs"></div>
<div class="difflbl" id="difflbl"></div>

<div class="quiz-wrap">
  <div id="quiz-section">
    <div class="progress"><div class="progress-fill" id="pfill" style="width:0%"></div></div>
    <div class="progress-label"><span id="plabel">Question 1 / 10</span><span id="pscore">0 ✓</span></div>
    <div class="q-card">
      <div class="q-flag" id="qflag"></div>
      <div class="q-text" id="qtext"></div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback"></div>
      <button class="btn btn-full btn-next" id="btn-next" onclick="nextQ()">suivant →</button>
    </div>
  </div>
  <div class="score-screen" id="score-screen">
    <div class="score-num" id="snum"></div>
    <div class="score-msg" id="smsg"></div>
    <div class="score-best" id="sbest"></div>
    <div class="score-actions">
      <button class="btn btn-full" onclick="startQuiz()">rejouer ce thème</button>
      <button class="btn btn-full" onclick="window.scrollTo({top:0,behavior:'smooth'})">changer de thème</button>
    </div>
  </div>
</div>
<footer>Ana & Adrien — the kompiuter</footer>

const QUIZ_LEN = 10;
let currentTheme = 0;
let qs = [], cur = 0, score = 0;

function lsGet(k,d){ try{ return localStorage.getItem(k) ?? d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

function shuffle(a){ const b=[...a]; for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }

// ── onglets ───────────────────────────────────────────────────
const tabsEl = document.getElementById('theme-tabs');
THEMES.forEach((t,i)=>{
  const btn = document.createElement('button');
  btn.className = 'ttab' + (i===0?' active':'');
  btn.innerHTML = '<span class="em">'+t.em+'</span><span class="tn">'+t.name+'</span>'+
                  '<span class="td">'+Array(t.diff+1).join('·')+'</span>';
  btn.onclick = ()=>{
    currentTheme = i;
    document.querySelectorAll('.ttab').forEach((x,j)=>x.classList.toggle('active',j===i));
    startQuiz();
    document.querySelector('.quiz-wrap').scrollIntoView({behavior:'smooth',block:'start'});
  };
  tabsEl.appendChild(btn);
});

// ── déroulé du quiz ───────────────────────────────────────────
function startQuiz(){
  const t = THEMES[currentTheme];
  document.getElementById('difflbl').textContent = t.label + '  ·  difficulté ' + Array(t.diff+1).join('★');
  qs = shuffle(t.questions).slice(0, Math.min(QUIZ_LEN, t.questions.length));
  cur = 0; score = 0;
  document.getElementById('score-screen').classList.remove('show');
  document.getElementById('quiz-section').style.display = '';
  showQ();
}

function showQ(){
  const q = qs[cur];
  document.getElementById('pfill').style.width = (cur/qs.length*100)+'%';
  document.getElementById('plabel').textContent = 'Question '+(cur+1)+' / '+qs.length;
  document.getElementById('pscore').textContent = score+' ✓';
  document.getElementById('qflag').textContent = THEMES[currentTheme].em;
  document.getElementById('qtext').textContent = q.q;
  const ch = document.getElementById('choices'); ch.innerHTML='';
  q.choices.forEach((c,i)=>{
    const b = document.createElement('button');
    b.className='choice'; b.textContent=c; b.onclick=()=>answer(i);
    ch.appendChild(b);
  });
  document.getElementById('feedback').classList.remove('show');
  document.getElementById('btn-next').classList.remove('show');
}

function answer(i){
  const q = qs[cur];
  const btns = document.querySelectorAll('.choice');
  btns.forEach(b=>b.disabled=true);
  const ok = i===q.correct;
  btns[i].classList.add(ok?'correct':'wrong');
  btns[q.correct].classList.add('correct');
  document.getElementById('feedback').textContent = (ok?'Bravo ! ':'Dommage. ') + q.expl;
  document.getElementById('feedback').classList.add('show');
  if(ok) score++;
  document.getElementById('pscore').textContent = score+' ✓';
  const bn = document.getElementById('btn-next');
  bn.textContent = cur+1<qs.length ? 'suivant →' : 'voir le résultat';
  bn.classList.add('show');
}

function nextQ(){ cur++; if(cur<qs.length) showQ(); else showScore(); }

function showScore(){
  document.getElementById('quiz-section').style.display='none';
  document.getElementById('score-screen').classList.add('show');
  document.getElementById('pfill').style.width='100%';
  const t = THEMES[currentTheme];
  document.getElementById('snum').textContent = score+'/'+qs.length;
  const p = score/qs.length;
  document.getElementById('smsg').textContent =
    p>=.9 ? 'parfait ! t\'es une encyclopédie, bah' :
    p>=.7 ? 'très bien — solide' :
    p>=.5 ? 'pas mal, mais on peut mieux faire' :
            'aïe. on révise et on rejoue ?';
  // meilleur score par thème
  const key = 'trivia-best-'+t.key;
  let best = parseInt(lsGet(key,'0'),10);
  if(score>best){ best=score; lsSet(key, String(best)); }
  document.getElementById('sbest').textContent = 'thème « '+t.name+' » — meilleur score : '+best+'/'+qs.length;
}

// ── init ──────────────────────────────────────────────────────
startQuiz();
</script>
