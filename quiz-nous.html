<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Sur Nous 🫶</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --rose:#e8637a; --cream:#fdf6ee; --deep:#2a1a2e; --gold:#d4a853; --text:#3d2a35; --green:#4a9e6e; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--cream); font-family:'DM Sans',sans-serif; color:var(--text); min-height:100vh; }
  body::before { content:''; position:fixed; inset:0; background-image:radial-gradient(circle,rgba(232,99,122,.08) 1px,transparent 1px); background-size:60px 60px; pointer-events:none; }
  .nav { padding:20px 32px; position:relative; z-index:1; }
  .back-btn { text-decoration:none; color:var(--rose); font-size:.9rem; opacity:.8; transition:opacity .2s; }
  .back-btn:hover { opacity:1; }
  .page-wrap { max-width:600px; margin:0 auto; padding:8px 28px 80px; position:relative; z-index:1; }
  .page-header { text-align:center; margin-bottom:32px; }
  .page-header h1 { font-family:'Playfair Display',serif; font-size:clamp(1.8rem,5vw,2.5rem); color:var(--deep); }
  .page-header p { margin-top:8px; color:#9b7a88; font-size:.92rem; font-style:italic; }

  .progress-bar { background:rgba(232,99,122,.15); border-radius:100px; height:6px; margin-bottom:6px; }
  .progress-fill { height:100%; background:var(--rose); border-radius:100px; transition:width .4s ease; }
  .progress-label { text-align:right; font-size:.78rem; color:#b899a6; margin-bottom:24px; }

  .q-card { background:white; border-radius:20px; padding:32px 28px; border:1.5px solid rgba(212,168,83,.25); box-shadow:0 4px 24px rgba(42,26,46,.07); }
  .q-num { font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; color:var(--rose); font-weight:500; margin-bottom:12px; }
  .q-text { font-family:'Playfair Display',serif; font-size:1.2rem; color:var(--deep); line-height:1.45; margin-bottom:24px; }

  .choices { display:flex; flex-direction:column; gap:10px; }
  .choice-btn {
    padding:14px 20px; background:white; border:1.5px solid rgba(201,184,216,.5);
    border-radius:12px; text-align:left; font-family:'DM Sans',sans-serif; font-size:.95rem;
    cursor:pointer; transition:all .18s; color:var(--text);
  }
  .choice-btn:hover:not(:disabled) { border-color:var(--rose); background:rgba(232,99,122,.05); transform:translateX(4px); }
  .choice-btn.correct  { background:#e8f8ef; border-color:var(--green); color:var(--green); }
  .choice-btn.wrong    { background:#fceaea; border-color:#c94a4a; color:#c94a4a; }
  .choice-btn:disabled { cursor:default; }

  .feedback { padding:14px 18px; border-radius:12px; font-size:.88rem; line-height:1.5; margin-top:8px; display:none; }
  .feedback.show { display:block; }
  .feedback.correct { background:#e8f8ef; color:#2d7a52; }
  .feedback.wrong   { background:#fceaea; color:#8b3030; }

  .btn-next { margin-top:20px; padding:13px 36px; background:var(--rose); color:white; border:none; border-radius:100px; font-family:'DM Sans',sans-serif; font-size:.95rem; font-weight:500; cursor:pointer; transition:all .2s; box-shadow:0 4px 16px rgba(232,99,122,.3); display:none; }
  .btn-next.show { display:inline-block; }
  .btn-next:hover { background:#d4526a; transform:translateY(-2px); }

  /* Score */
  .score-screen { text-align:center; display:none; }
  .score-screen.show { display:block; }
  .score-emoji { font-size:4rem; margin-bottom:12px; }
  .score-big { font-family:'Playfair Display',serif; font-size:4.5rem; color:var(--rose); line-height:1; margin-bottom:10px; }
  .score-msg { font-size:1rem; color:#6b5060; margin-bottom:28px; }
  .btn-restart { padding:13px 36px; background:var(--rose); color:white; border:none; border-radius:100px; font-family:'DM Sans',sans-serif; font-size:.95rem; font-weight:500; cursor:pointer; transition:all .2s; box-shadow:0 4px 16px rgba(232,99,122,.3); }
  .btn-restart:hover { background:#d4526a; transform:translateY(-2px); }
</style>
</head>
<body>
<nav class="nav"><a href="index.html" class="back-btn">← Retour</a></nav>
<main class="page-wrap">
  <div class="page-header">
    <h1>Quiz Sur Nous 🫶</h1>
    <p>est-ce qu'on se connaît vraiment ?</p>
  </div>

  <div id="quiz-section">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="progress-label" id="progress-label">Question 1 / ?</div>
    <div class="q-card">
      <div class="q-num" id="q-num">Question 1</div>
      <div class="q-text" id="q-text"></div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback"></div>
      <button class="btn-next" id="btn-next" onclick="nextQ()">Suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="score-screen">
    <div class="score-emoji" id="score-emoji"></div>
    <div class="score-big" id="score-big"></div>
    <div class="score-msg" id="score-msg"></div>
    <button class="btn-restart" onclick="startQuiz()">Rejouer ✨</button>
  </div>
</main>

<script>
// =====================================================
// QUIZ SUR NOUS — REMPLACE LES QUESTIONS ICI
// correct: index (0-based) de la bonne réponse
// expl: texte affiché après la réponse (anecdote, explication...)
// =====================================================
const QUESTIONS = [
  {
    q: "Où nous sommes-nous rencontrés pour la première fois ?",
    choices: ["À ajouter", "À ajouter", "À ajouter", "À ajouter"],
    correct: 0,
    expl: "Remplace cette question et ces choix dans le fichier quiz-nous.html !"
  },
  {
    q: "Quelle est ma couleur préférée ?",
    choices: ["Bleu", "Vert", "Rouge", "Jaune"],
    correct: 0,
    expl: "Remplace par ta vraie couleur préférée ici."
  },
  {
    q: "Quel est mon plat favori ?",
    choices: ["À définir", "À définir", "À définir", "À définir"],
    correct: 0,
    expl: "À personnaliser !"
  },
  {
    q: "Quel film avons-nous regardé ensemble pour la première fois ?",
    choices: ["À ajouter", "À ajouter", "À ajouter", "À ajouter"],
    correct: 0,
    expl: "Souvenir à remplir ici."
  },
  {
    q: "Quelle est ma chanson préférée en ce moment ?",
    choices: ["À définir", "À définir", "À définir", "À définir"],
    correct: 0,
    expl: "À personnaliser !"
  },
  {
    q: "Quel est mon rêve de voyage numéro 1 ?",
    choices: ["Le Japon", "L'Islande", "Le Brésil", "La Nouvelle-Zélande"],
    correct: 0,
    expl: "Remplace selon la réalité !"
  },
  {
    q: "Quelle est ma plus grande peur ?",
    choices: ["À définir", "À définir", "À définir", "À définir"],
    correct: 0,
    expl: "Question intime — personnalise-la."
  },
  {
    q: "Comment je préfère passer un dimanche idéal ?",
    choices: ["Sortir en balade", "Rester au lit", "Cuisiner ensemble", "Visiter un musée"],
    correct: 0,
    expl: "À adapter selon la réalité !"
  },
  {
    q: "Quel surnom m'appelles-tu parfois ?",
    choices: ["À définir", "À définir", "À définir", "À définir"],
    correct: 0,
    expl: "Un secret entre vous deux !"
  },
  {
    q: "Si je devais décrire notre relation en un mot, ce serait…",
    choices: ["Évidence", "Magie", "Aventure", "Douceur"],
    correct: 0,
    expl: "Pas de mauvaise réponse ici 💛"
  },
];

let current = 0, score = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

let questions = [];

function startQuiz() {
  questions = shuffle(QUESTIONS);
  current = 0; score = 0;
  document.getElementById('score-screen').classList.remove('show');
  document.getElementById('quiz-section').style.display = '';
  showQ();
}

function showQ() {
  const q = questions[current];
  const pct = (current / questions.length) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `Question ${current+1} / ${questions.length}`;
  document.getElementById('q-num').textContent = `Question ${current+1}`;
  document.getElementById('q-text').textContent = q.q;

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c;
    btn.onclick = () => answer(i);
    choicesEl.appendChild(btn);
  });

  document.getElementById('feedback').classList.remove('show','correct','wrong');
  document.getElementById('btn-next').classList.remove('show');
}

function answer(idx) {
  const q = questions[current];
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach(b => b.disabled = true);
  const ok = idx === q.correct;
  btns[idx].classList.add(ok ? 'correct' : 'wrong');
  btns[q.correct].classList.add('correct');
  const fb = document.getElementById('feedback');
  fb.textContent = (ok ? '💛 ' : '✗ ') + q.expl;
  fb.className = 'feedback show ' + (ok ? 'correct' : 'wrong');
  if (ok) score++;
  const btn = document.getElementById('btn-next');
  btn.textContent = current+1 < questions.length ? 'Suivante →' : 'Voir le résultat 🎉';
  btn.classList.add('show');
}

function nextQ() {
  current++;
  if (current < questions.length) showQ(); else showScore();
}

function showScore() {
  document.getElementById('quiz-section').style.display = 'none';
  document.getElementById('score-screen').classList.add('show');
  const pct = score / questions.length;
  document.getElementById('score-big').textContent = `${score}/${questions.length}`;
  const [emoji, msg] = pct >= 0.9 ? ['🏆','Tu me connais mieux que moi-même !']
    : pct >= 0.7 ? ['🌟','Très bien joué, tu fais attention à moi 💛']
    : pct >= 0.5 ? ['💪','Pas mal — on a encore plein de choses à découvrir !']
    : ['💌','On a du boulot… mais c\'est ça l\'aventure !'];
  document.getElementById('score-emoji').textContent = emoji;
  document.getElementById('score-msg').textContent = msg;
}

startQuiz();
</script>
</body>
</html>
