<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nous — Ana & Adrien</title>
<link rel="stylesheet" href="style.css">
<style>
  .page-header{padding:40px 40px 32px;border-bottom:var(--trait) solid var(--bord-l);}
  .page-header h1{font-size:2rem;color:var(--bord);}
  .page-header p{font-size:0.9rem;color:var(--muted);margin-top:6px;}
  .quiz-wrap{max-width:600px;margin:0 auto;padding:40px 40px 80px;}
  .progress{height:3px;background:var(--bord-l);margin-bottom:8px;}
  .progress-fill{height:100%;background:var(--bord);transition:width .4s;}
  .progress-label{font-size:0.8rem;color:var(--muted);margin-bottom:28px;}
  .q-card{border:var(--trait) solid var(--bord-l);padding:28px;margin-bottom:20px;}
  .q-num{font-size:0.8rem;color:var(--muted);margin-bottom:10px;}
  .q-text{font-size:1.15rem;color:var(--text);line-height:1.5;}
  .choices{display:flex;flex-direction:column;gap:8px;margin-top:24px;}
  .choice{padding:13px 18px;border:var(--trait) solid var(--bord-l);background:transparent;text-align:left;font-family:'Patrick Hand',cursive;font-size:1rem;cursor:pointer;color:var(--text);transition:all .15s;}
  .choice:hover:not(:disabled){border-color:var(--bord);background:var(--bord-l);}
  .choice.correct{background:var(--bord);color:var(--blanc);border-color:var(--bord);}
  .choice.wrong{background:var(--bord-l);color:var(--bord);border-color:var(--bord);text-decoration:line-through;}
  .choice:disabled{cursor:default;}
  .feedback{padding:14px 18px;border-left:var(--trait) solid var(--bord);font-size:0.95rem;color:var(--muted);margin-top:8px;display:none;line-height:1.6;}
  .feedback.show{display:block;}
  .btn-next{margin-top:20px;display:none;}
  .btn-next.show{display:inline-block;}
  .score-screen{display:none;text-align:center;padding:60px 40px;}
  .score-screen.show{display:block;}
  .score-num{font-size:5rem;color:var(--bord);line-height:1;}
  .score-msg{font-size:1.1rem;color:var(--muted);margin:16px 0 32px;}
</style>
</head>
<body>
<nav class="nav"><a href="index.html" class="back-btn">← retour</a><div class="nav-title">Nous</div><div></div></nav>
<div class="page-header"><h1>Quiz — Nous</h1><p>est-ce qu'on se connaît vraiment ?</p></div>
<div class="quiz-wrap">
  <div id="quiz-section">
    <div class="progress"><div class="progress-fill" id="pfill" style="width:0%"></div></div>
    <div class="progress-label" id="plabel">Question 1 / 10</div>
    <div class="q-card">
      <div class="q-num" id="qnum">Question 1</div>
      <div class="q-text" id="qtext"></div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback"></div>
      <button class="btn btn-full btn-next" id="btn-next" onclick="nextQ()">suivant →</button>
    </div>
  </div>
  <div class="score-screen" id="score-screen">
    <div class="score-num" id="snum"></div>
    <div class="score-msg" id="smsg"></div>
    <button class="btn btn-full" onclick="startQuiz()">rejouer</button>
  </div>
</div>
<footer>Ana & Adrien</footer>
<script>
// ── REMPLACE CES QUESTIONS PAR LES VÔTRES ──
const ALL=[
  {q:"Où nous sommes-nous rencontrés ?",choices:["À compléter","À compléter","À compléter","À compléter"],correct:0,expl:"À personnaliser dans quiz-nous.html !"},
  {q:"Quelle est ma couleur préférée ?",choices:["Bleu","Vert","Rouge","Jaune"],correct:0,expl:"À adapter !"},
  {q:"Quel est mon plat favori ?",choices:["À définir","À définir","À définir","À définir"],correct:0,expl:"À personnaliser !"},
  {q:"Quel film avons-nous regardé ensemble pour la première fois ?",choices:["À ajouter","À ajouter","À ajouter","À ajouter"],correct:0,expl:"Souvenir à remplir !"},
  {q:"Quelle est ma chanson préférée en ce moment ?",choices:["À définir","À définir","À définir","À définir"],correct:0,expl:"À personnaliser !"},
  {q:"Quel est mon rêve de voyage numéro 1 ?",choices:["Le Japon","L'Islande","Le Brésil","La Nouvelle-Zélande"],correct:0,expl:"Remplace selon la réalité !"},
  {q:"Comment je préfère passer un dimanche idéal ?",choices:["Sortir en balade","Rester au lit","Cuisiner ensemble","Visiter un musée"],correct:0,expl:"À adapter !"},
  {q:"Quel surnom m'appelles-tu ?",choices:["À définir","À définir","À définir","À définir"],correct:0,expl:"Un secret entre vous deux !"},
  {q:"Quelle est ma plus grande peur ?",choices:["À définir","À définir","À définir","À définir"],correct:0,expl:"Question intime — personnalise-la."},
  {q:"Si je devais décrire notre relation en un mot ?",choices:["Évidence","Magie","Aventure","Douceur"],correct:0,expl:"Pas de mauvaise réponse."},
];
let qs=[],cur=0,score=0;
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function startQuiz(){qs=shuffle(ALL);cur=0;score=0;document.getElementById('score-screen').classList.remove('show');document.getElementById('quiz-section').style.display='';showQ();}
function showQ(){const q=qs[cur];document.getElementById('pfill').style.width=(cur/qs.length*100)+'%';document.getElementById('plabel').textContent='Question '+(cur+1)+' / '+qs.length;document.getElementById('qnum').textContent='Question '+(cur+1);document.getElementById('qtext').textContent=q.q;const ch=document.getElementById('choices');ch.innerHTML='';q.choices.forEach((c,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(i);ch.appendChild(b);});document.getElementById('feedback').classList.remove('show');document.getElementById('btn-next').classList.remove('show');}
function answer(i){const q=qs[cur];const btns=document.querySelectorAll('.choice');btns.forEach(b=>b.disabled=true);const ok=i===q.correct;btns[i].classList.add(ok?'correct':'wrong');btns[q.correct].classList.add('correct');document.getElementById('feedback').textContent=q.expl;document.getElementById('feedback').classList.add('show');if(ok)score++;const bn=document.getElementById('btn-next');bn.textContent=cur+1<qs.length?'suivant →':'voir le résultat';bn.classList.add('show');}
function nextQ(){cur++;if(cur<qs.length)showQ();else showScore();}
function showScore(){document.getElementById('quiz-section').style.display='none';document.getElementById('score-screen').classList.add('show');document.getElementById('snum').textContent=score+'/'+qs.length;const p=score/qs.length;document.getElementById('smsg').textContent=p>=.9?'tu me connais mieux que moi-même !':p>=.7?'très bien joué':p>=.5?'pas mal — encore un effort !':'on a du boulot !';}
startQuiz();
</script>
</body>
</html>
