<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>whaaaat ???</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:100%;
    min-height:100%;
    font-family:'Patrick Hand', cursive;
    cursor:none;
    background:#8B1A2B;
    color:#FAF8F4;
  }

  /* custom cursor */
  .cursor {
    position:fixed;
    width:26px;
    height:26px;
    border:2px solid #FAF8F4;
    border-radius:50%;
    pointer-events:none;
    z-index:9999;
    transform:translate(-50%,-50%);
    transition:width .15s, height .15s;
  }

  .cursor.click {
    width:12px;
    height:12px;
  }

  /* ÉCRAN CHOC */
  #shock {
    position:fixed;
    inset:0;
    background:#8B1A2B;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:32px;
    z-index:100;
    padding:40px;
    text-align:center;
    transition:opacity .6s ease;
  }

  #shock.out {
    opacity:0;
    pointer-events:none;
  }

  .shock-title {
    font-size:clamp(2.4rem, 10vw, 7rem);
    line-height:1.05;
    letter-spacing:-0.01em;
  }

  .shock-sub {
    font-size:clamp(1rem, 3vw, 1.6rem);
    opacity:0.7;
    max-width:520px;
    line-height:1.6;
  }

  .shock-btns {
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:8px;
  }

  .btn-go-out {
    font-family:'Patrick Hand', cursive;
    font-size:1rem;
    padding:12px 28px;
    border:2px solid #FAF8F4;
    background:transparent;
    color:#FAF8F4;
    cursor:none;
    transition:background .18s, color .18s;
    letter-spacing:0.04em;
  }

  .btn-go-out:hover {
    background:#FAF8F4;
    color:#8B1A2B;
  }

  .btn-stay {
    font-family:'Patrick Hand', cursive;
    font-size:0.88rem;
    padding:12px 28px;
    border:1px dashed rgba(250,248,244,0.35);
    background:transparent;
    color:rgba(250,248,244,0.5);
    cursor:none;
    transition:all .18s;
    letter-spacing:0.04em;
  }

  .btn-stay:hover {
    border-color:rgba(250,248,244,0.7);
    color:#FAF8F4;
  }

  /* GALERIE */
  #gallery {
    display:none;
    padding:64px 40px 100px;
    max-width:980px;
    margin:0 auto;
  }

  #gallery.visible {
    display:block;
    animation:fadeIn .5s ease;
  }

  .gal-header {
    text-align:center;
    margin-bottom:56px;
  }

  .gal-title {
    font-size:clamp(1.8rem, 6vw, 4rem);
    line-height:1.1;
    margin-bottom:12px;
  }

  .gal-sub {
    font-size:1rem;
    opacity:0.55;
    line-height:1.65;
    max-width:480px;
    margin:0 auto;
  }

  .gal-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:16px;
  }

  .gal-item {
    aspect-ratio:1;
    overflow:hidden;
    position:relative;
    background:rgba(250,248,244,0.06);
  }

  .gal-item img {
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:grayscale(20%);
    transition:filter .3s, transform .3s;
  }

  .gal-item:hover img {
    filter:grayscale(0%);
    transform:scale(1.03);
  }

  .gal-back {
    display:block;
    text-align:center;
    margin-top:56px;
    font-size:0.88rem;
    color:rgba(250,248,244,0.4);
    text-decoration:none;
    transition:color .18s;
    letter-spacing:0.06em;
  }

  .gal-back:hover {
    color:#FAF8F4;
  }

  @keyframes fadeIn {
    from {
      opacity:0;
      transform:translateY(10px);
    }

    to {
      opacity:1;
      transform:translateY(0);
    }
  }

  @media (max-width:700px) {
    #gallery {
      padding:48px 18px 80px;
    }

    .gal-grid {
      grid-template-columns:repeat(2, 1fr);
      gap:10px;
    }
  }
</style>
</head>

<body>

<div class="cursor" id="cursor"></div>

<!-- ÉCRAN CHOC -->
<div id="shock">
  <div class="shock-title">whaaaat ???<br>like …. nooo…<br>no way</div>
  <div class="shock-sub">you have to go out of the site oh la la<br>… but you can discover us a bit ok if you want i guess</div>
  <div class="shock-btns">
    <button class="btn-go-out" onclick="goOut()">get out !!</button>
    <button class="btn-stay" onclick="stayAndSee()">ok i guess i'll stay</button>
  </div>
</div>

<!-- GALERIE -->
<div id="gallery">
  <div class="gal-header">
    <div class="gal-title">ok fine.<br>here we are i guess</div>
    <div class="gal-sub">ana & adrien. the two persons. in the world. doing the things.</div>
  </div>

  <div class="gal-grid" id="gal-grid">
    <div class="gal-item">
      <img src="./WhatsApp%20Image%202026-05-30%20at%2008.30.15%20%281%29.webp" alt="Ana and Adrien photo 1">
    </div>

    <div class="gal-item">
      <img src="./WhatsApp%20Image%202026-05-30%20at%2008.30.15%20%283%29.webp" alt="Ana and Adrien photo 2">
    </div>

    <div class="gal-item">
      <img src="./WhatsApp%20Image%202026-05-30%20at%2008.30.13.webp" alt="Ana and Adrien photo 3">
    </div>

    <div class="gal-item">
      <img src="./WhatsApp%20Image%202026-05-30%20at%2008.30.15%20%286%29.webp" alt="Ana and Adrien photo 4">
    </div>

    <div class="gal-item">
      <img src="./WhatsApp%20Image%202026-05-30%20at%2008.30.15.webp" alt="Ana and Adrien photo 5">
    </div>
  </div>

  <a href="home.html" class="gal-back">← back to the site (if you must)</a>
</div>

<script>
  // Curseur
  const cur = document.getElementById('cursor');

  document.addEventListener('mousemove', e => {
    cur.style.left = e.clientX + 'px';
    cur.style.top = e.clientY + 'px';
  });

  document.addEventListener('mousedown', () => cur.classList.add('click'));
  document.addEventListener('mouseup', () => cur.classList.remove('click'));

  function goOut() {
    window.location.href = 'https://www.google.com';
  }

  function stayAndSee() {
    const shock = document.getElementById('shock');
    const gallery = document.getElementById('gallery');

    shock.classList.add('out');

    setTimeout(() => {
      shock.style.display = 'none';
      gallery.classList.add('visible');
    }, 620);
  }
</script>

</body>
</html>
