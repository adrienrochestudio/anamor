<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ana & Adrien</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --sienna:  #8C3A1E;
    --sienna-d:#5C220C;
    --vert:    #2E4600;
    --beige:   #F5EFE4;
    --beige-2: #EDE3D0;
    --beige-3: #E0D3BA;
    --beige-4: #C8B89A;
    --text:    #2A1A0E;
    --muted:   #7A5C3E;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--beige);
    font-family: 'Cormorant Garamond', serif;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Liseret vert en haut uniquement */
  body::before {
    content: '';
    position: fixed;
    top:0; left:0; right:0;
    height: 3px;
    background: var(--vert);
    z-index: 20;
  }

  /* ── HEADER ── */
  header {
    text-align: center;
    padding: 72px 24px 32px;
  }

  .eyebrow {
    font-size: 0.68rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 400;
    margin-bottom: 16px;
  }

  .title-main {
    font-size: clamp(3.2rem, 9vw, 6rem);
    font-weight: 300;
    font-style: italic;
    color: var(--text);
    line-height: 1;
    letter-spacing: -0.01em;
  }

  .title-amp {
    font-style: normal;
    font-weight: 300;
    color: var(--sienna);
    margin: 0 0.18em;
    font-size: 0.75em;
    vertical-align: middle;
  }

  .divider-line {
    width: 40px;
    height: 1px;
    background: var(--beige-4);
    margin: 24px auto;
  }

  /* ── MOT D'AMOUR ── */
  .mot-wrap {
    max-width: 560px;
    margin: 0 auto 16px;
    padding: 0 32px;
    text-align: center;
    position: relative;
  }

  .mot-text {
    font-size: clamp(1.05rem, 2.5vw, 1.25rem);
    font-style: italic;
    font-weight: 300;
    color: var(--sienna-d);
    line-height: 1.7;
  }

  .mot-author {
    margin-top: 10px;
    font-size: 0.8rem;
    font-weight: 400;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  /* ── WHEEL ── */
  .wheel-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px 56px;
  }

  .wheel-container {
    position: relative;
    width: 340px; height: 340px;
    max-width: 86vw; max-height: 86vw;
  }

  #wheel-canvas {
    width: 100%; height: 100%;
    filter: drop-shadow(0 10px 36px rgba(44,26,14,0.14));
  }

  /* Pointeur : petit trait fin sienna */
  .wheel-pointer {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 20px;
    background: var(--sienna);
    z-index: 6;
  }

  .wheel-pointer::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 50%;
    transform: translateX(-50%);
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--sienna);
  }

  .wheel-center {
    position: absolute;
    top:50%; left:50%;
    transform: translate(-50%,-50%);
    width: 74px; height: 74px;
    border-radius: 50%;
    background: var(--beige);
    border: 1.5px solid var(--beige-3);
    display: flex; align-items: center; justify-content: center;
    z-index: 5; cursor: pointer;
    transition: transform 0.18s, border-color 0.18s;
    user-select: none; overflow: hidden;
  }

  .wheel-center:hover {
    transform: translate(-50%,-50%) scale(1.06);
    border-color: var(--vert);
  }

  .wheel-center img {
    width:100%; height:100%; object-fit:cover; border-radius:50%;
  }

  .wheel-initials {
    font-size: 1rem;
    font-style: italic;
    font-weight: 300;
    color: var(--sienna);
    letter-spacing: 0.06em;
  }

  .spin-btn {
    margin-top: 32px;
    padding: 12px 56px;
    background: var(--sienna);
    color: var(--beige);
    border: none;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.85rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, transform 0.18s;
  }

  .spin-btn:hover:not(:disabled) {
    background: var(--sienna-d);
    transform: translateY(-1px);
  }

  .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* ── GRILLE ACTIVITÉS ── */
  .activities {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 28px 96px;
  }

  .section-rule {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }

  .section-rule span {
    font-size: 0.65rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .section-rule::before,
  .section-rule::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--beige-3);
  }

  .mini-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 2px;
  }

  .mini-card {
    background: var(--beige-2);
    padding: 24px 14px 20px;
    text-decoration: none;
    color: var(--text);
    transition: background 0.18s, color 0.18s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    cursor: pointer;
    border: none;
    font-family: 'Cormorant Garamond', serif;
  }

  .mini-card:hover {
    background: var(--sienna);
  }

  .mini-card:hover .card-num  { color: rgba(245,239,228,0.4); }
  .mini-card:hover .card-name { color: var(--beige); }

  .card-num {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--beige-4);
    font-weight: 300;
    transition: color 0.18s;
  }

  .card-name {
    font-size: 0.95rem;
    font-style: italic;
    color: var(--text);
    text-align: center;
    letter-spacing: 0.02em;
    transition: color 0.18s;
  }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(42,26,14,0.55);
    backdrop-filter: blur(8px);
    z-index: 100;
    align-items: center; justify-content: center;
    padding: 24px;
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--beige);
    padding: 52px 44px 44px;
    max-width: 360px; width: 100%;
    text-align: center;
    border-top: 2px solid var(--vert);
    box-shadow: 0 32px 80px rgba(42,26,14,0.25);
    animation: fadeUp 0.28s ease;
  }

  @keyframes fadeUp {
    from { transform: translateY(20px); opacity:0; }
    to   { transform: translateY(0);    opacity:1; }
  }

  .modal-bar {
    width: 32px; height: 1px;
    background: var(--beige-4);
    margin: 0 auto 28px;
  }

  .modal-title {
    font-size: 1.9rem;
    font-style: italic;
    font-weight: 300;
    color: var(--sienna-d);
    margin-bottom: 12px;
  }

  .modal-desc {
    font-size: 1rem;
    font-weight: 300;
    color: var(--muted);
    line-height: 1.7;
    margin-bottom: 36px;
  }

  .modal-btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  .btn-go {
    padding: 11px 30px;
    background: var(--sienna);
    color: var(--beige);
    border: none;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.82rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: background 0.18s;
  }

  .btn-go:hover { background: var(--sienna-d); }

  .btn-back {
    padding: 11px 22px;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--beige-3);
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.82rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color 0.18s, color 0.18s;
  }

  .btn-back:hover { border-color: var(--muted); color: var(--text); }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 24px;
    font-size: 0.65rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--beige-4);
    border-top: 1px solid var(--beige-3);
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Ana &amp; Adrien</div>
  <div class="title-main">Ana<span class="title-amp">&amp;</span>Adrien</div>
</header>

<div class="divider-line"></div>

<!-- MOT D'AMOUR -->
<div class="mot-wrap">
  <div class="mot-text" id="mot-text"></div>
  <div class="mot-author" id="mot-author"></div>
</div>

<div class="divider-line"></div>

<!-- ROUE -->
<section class="wheel-section">
  <div class="wheel-container">
    <div class="wheel-pointer"></div>
    <canvas id="wheel-canvas" width="340" height="340"></canvas>
    <div class="wheel-center" id="wheel-center" onclick="spinWheel()">
      <span class="wheel-initials">A&amp;A</span>
    </div>
  </div>
  <button class="spin-btn" id="spin-btn" onclick="spinWheel()">Tourner</button>
</section>

<!-- GRILLE -->
<section class="activities">
  <div class="section-rule"><span>Activités</span></div>
  <div class="mini-grid" id="mini-grid"></div>
</section>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-bar"></div>
    <div class="modal-title"  id="modal-title"></div>
    <div class="modal-desc"   id="modal-desc"></div>
    <div class="modal-btns">
      <a href="#" class="btn-go"  id="modal-go">Accéder</a>
      <button class="btn-back" onclick="closeModal()">Retour</button>
    </div>
  </div>
</div>

<footer>Ana &amp; Adrien</footer>

<script>
// ── CITATIONS ──────────────────────────────────────────
const MOTS = [
  { text: "Aimer, ce n'est pas se regarder l'un l'autre, c'est regarder ensemble dans la même direction.", author: "Antoine de Saint-Exupéry" },
  { text: "O amor é uma força que une dois corações e os faz bater como um só.", author: "Drummond de Andrade" },
  { text: "Il n'y a qu'un bonheur dans la vie, c'est d'aimer et d'être aimé.", author: "George Sand" },
  { text: "Amar é encontrar na felicidade do outro a própria felicidade.", author: "Gottfried Leibniz" },
  { text: "Le cœur a ses raisons que la raison ne connaît point.", author: "Blaise Pascal" },
  { text: "De tudo, ao meu amor serei atento antes, e com tal zelo, e sempre, e tanto.", author: "Vinícius de Moraes" },
  { text: "Un seul être vous manque, et tout est dépeuplé.", author: "Alphonse de Lamartine" },
  { text: "Amar é dar ao outro o poder de te destruir, e confiar que não o fará.", author: "C. S. Lewis" },
  { text: "On ne voit bien qu'avec le cœur. L'essentiel est invisible pour les yeux.", author: "Antoine de Saint-Exupéry" },
  { text: "O amor não olha a distância, porque o coração não tem fronteiras.", author: "Rubem Alves" },
  { text: "Là où tu vas, j'irai. Là où tu mourras, je mourrai.", author: "Livre de Ruth" },
  { text: "Amar é a única coisa que cresce quanto mais se divide.", author: "Paulo Coelho" },
  { text: "L'amour est la poésie des sens.", author: "Honoré de Balzac" },
  { text: "Quem ama não calcula, não mede, não pesa — apenas ama.", author: "Fernando Pessoa" },
  { text: "Aimer, c'est trouver sa richesse hors de soi.", author: "Alain" },
];

function showDailyMot() {
  // Bascule à 2h du matin : on soustrait 2h avant de calculer le "jour"
  const now    = new Date();
  const shifted = new Date(now.getTime() - 2 * 60 * 60 * 1000);
  const dayKey  = shifted.getFullYear() * 10000
                + (shifted.getMonth() + 1) * 100
                + shifted.getDate();
  const idx = dayKey % MOTS.length;
  document.getElementById('mot-text').textContent   = '\u201c' + MOTS[idx].text + '\u201d';
  document.getElementById('mot-author').textContent = '\u2014 ' + MOTS[idx].author;
}
showDailyMot();

// ── ACTIVITÉS ─────────────────────────────────────────
const SECTIONS = [
  { label: "Poème",        url: "poeme.html",            desc: "Un poème d'amour tiré au sort, français ou brésilien." },
  { label: "Metrodoku",    url: "https://metrodoku.fr/", desc: "Notre jeu de sudoku préféré." },
  { label: "Trivia",       url: "quiz-histoire.html",    desc: "France & Brésil mélangés — qui en sait le plus ?" },
  { label: "Mots croisés", url: "mots-croises.html",     desc: "Des grilles à remplir, score mémorisé." },
  { label: "Nous",         url: "quiz-nous.html",        desc: "Est-ce qu'on se connaît vraiment ?" },
  { label: "Todo",         url: "https://www.icloud.com/notes/038_LgyD3tTC4I2XbACKHyCzA#To_do_AA", desc: "Notre liste partagée." },
];

const grid = document.getElementById('mini-grid');
SECTIONS.forEach((s, i) => {
  const a = document.createElement('a');
  a.href      = s.url;
  a.className = 'mini-card';
  if (s.url.startsWith('http')) a.target = '_blank';
  a.innerHTML = `<span class="card-num">${String(i+1).padStart(2,'0')}</span><span class="card-name">${s.label}</span>`;
  grid.appendChild(a);
});

// ── ROUE ──────────────────────────────────────────────
// Palette : siennas et beiges uniquement, vert zéro
const SLICES = [
  { fill:'#8C3A1E', text:'#F5EFE4' },
  { fill:'#E0D3BA', text:'#5C220C' },
  { fill:'#5C220C', text:'#F5EFE4' },
  { fill:'#C8B89A', text:'#2A1A0E' },
  { fill:'#A0522D', text:'#F5EFE4' },
  { fill:'#EDE3D0', text:'#5C220C' },
];

const canvas = document.getElementById('wheel-canvas');
const ctx    = canvas.getContext('2d');
const N      = SECTIONS.length;
const ARC    = (2 * Math.PI) / N;
let angle    = 0, spinning = false;

function drawWheel(a) {
  const cx = canvas.width/2, cy = canvas.height/2, r = cx - 6;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < N; i++) {
    const s  = SLICES[i % SLICES.length];
    const s0 = a + i * ARC - Math.PI/2;
    const s1 = s0 + ARC;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, s0, s1);
    ctx.closePath();
    ctx.fillStyle = s.fill;
    ctx.fill();
    ctx.strokeStyle = '#F5EFE4';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(s0 + ARC/2);
    ctx.textAlign = 'right';
    ctx.fillStyle = s.text;
    ctx.font = 'italic 300 13px "Cormorant Garamond", serif';
    ctx.fillText(SECTIONS[i].label, r - 18, 5);
    ctx.restore();
  }

  // Anneau extérieur vert fin
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, 2*Math.PI);
  ctx.strokeStyle = '#2E4600';
  ctx.lineWidth = 2;
  ctx.stroke();
}

drawWheel(angle);

function spinWheel() {
  if (spinning) return;
  spinning = true;
  document.getElementById('spin-btn').disabled = true;
  const extra = 2*Math.PI*(7 + Math.random()*6);
  const dur   = 3800 + Math.random()*1400;
  const t0    = performance.now();
  const a0    = angle;
  function ease(t) { return 1 - Math.pow(1-t, 4); }
  function frame(now) {
    const t = Math.min((now-t0)/dur, 1);
    angle   = a0 + extra * ease(t);
    drawWheel(angle);
    if (t < 1) { requestAnimationFrame(frame); return; }
    spinning = false;
    document.getElementById('spin-btn').disabled = false;
    showResult();
  }
  requestAnimationFrame(frame);
}

function showResult() {
  const norm  = (((-angle) % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
  const idx   = Math.floor(norm / ARC) % N;
  const sec   = SECTIONS[idx];
  document.getElementById('modal-title').textContent = sec.label;
  document.getElementById('modal-desc').textContent  = sec.desc;
  const lnk   = document.getElementById('modal-go');
  lnk.href    = sec.url;
  lnk.target  = sec.url.startsWith('http') ? '_blank' : '';
  document.getElementById('modal').classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});
document.getElementById('wheel-center').addEventListener('click', spinWheel);
</script>
</body>
</html>
