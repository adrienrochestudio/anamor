<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ana & Adrien</title>
<link rel="icon" type="image/png" href="favicon2.png">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    overflow:hidden;
    font-family:'Patrick Hand', cursive;
    cursor:none;
  }

  .cursor {
    position:fixed;
    width:26px; height:26px;
    border:2px solid currentColor;
    border-radius:50%;
    pointer-events:none;
    z-index:9999;
    transform:translate(-50%,-50%);
    transition:width .15s, height .15s;
  }
  .cursor.click { width:12px; height:12px; }

  .hint {
    position:fixed; bottom:32px; left:50%;
    transform:translateX(-50%);
    font-size:0.88rem; letter-spacing:0.06em;
    z-index:200; pointer-events:none;
    animation:blink 2.4s ease-in-out infinite;
    transition:opacity .4s;
  }
  @keyframes blink { 0%,100%{opacity:.25} 50%{opacity:.65} }

  .counter {
    position:fixed; top:24px; right:28px;
    font-size:0.82rem; z-index:200; opacity:0.25;
  }

  .fade-cover {
    position:fixed; inset:0; z-index:500;
    opacity:0; pointer-events:none;
    transition:opacity .55s ease;
  }
  .fade-cover.on { opacity:1; pointer-events:all; }

  /* ── SLIDES ── */
  .slide {
    position:fixed; inset:0;
    opacity:0;
    transition:opacity .95s ease;
    pointer-events:none;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .slide.active { opacity:1; pointer-events:all; }
  .slide.out    { opacity:0; pointer-events:none; }

  /* Fonds */
  .bg-b { background:#8B1A2B; color:#FAF8F4; }
  .bg-w { background:#FAF8F4; color:#8B1A2B; }

  /* ── IMAGE ── */
  .img-wrap {
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:min(52vw, 52vh);
    height:min(52vw, 52vh);
    z-index:1;
  }
  .img-wrap img {
    width:100%; height:100%;
    object-fit:contain;
    display:block;
  }

  /* ── TEXTES ── */
  .txt {
    position:absolute;
    z-index:2;
    font-family:'Patrick Hand', cursive;
    line-height:1.2;
    font-size:clamp(1.4rem, 4vw, 2.8rem);
  }

  /* ── SLIDE 1 ── */
  #s1 .txt { top:38%; left:50%; transform:translateX(-50%); font-size:clamp(2rem,6vw,4rem); }

  /* ── SLIDE 2 ── */
  #s2 .t-hello {
    top:9%; left:7%;
    font-size:clamp(2rem,5.5vw,3.8rem);
    transform:rotate(-4deg);
  }
  #s2 .t-uh {
    top:18%; right:8%;
    font-size:clamp(1rem,2.8vw,2rem);
    transform:rotate(3deg);
    opacity:0.7;
  }

  /* ── SLIDE 3 ── */
  #s3 .t-what {
    top:12%; left:50%;
    transform:translateX(-50%);
    font-size:clamp(1.6rem,4.5vw,3.2rem);
    text-align:center;
    width:90%;
  }
  #s3 .t-you {
    bottom:12%; left:50%;
    transform:translateX(-50%);
    font-size:clamp(1rem,2.8vw,2rem);
    opacity:0.7;
    text-align:center;
  }

  /* ── SLIDE 4 ── */
  #s4 .t-cool {
    top:10%; left:50%;
    transform:translateX(-50%);
    font-size:clamp(1.8rem,5vw,3.5rem);
    text-align:center;
  }
  #s4 .t-lonely {
    bottom:10%; right:6%;
    font-size:clamp(1rem,2.8vw,2rem);
    transform:rotate(6deg);
    opacity:0.7;
    text-align:right;
  }

  /* ── SLIDE 5 ── */
  #s5 .t-thought {
    top:10%; left:50%;
    transform:translateX(-50%);
    font-size:clamp(1.8rem,4.5vw,3.2rem);
    text-align:center;
    width:90%;
  }
  #s5 .t-komputer {
    bottom:10%; left:50%;
    transform:translateX(-50%);
    font-size:clamp(1rem,2.6vw,1.9rem);
    opacity:0.7;
    text-align:center;
  }

  /* ── SLIDE 6 ── */
  #s6 .t-create {
    top:10%; left:50%;
    transform:translateX(-50%);
    font-size:clamp(1.8rem,5vw,3.5rem);
    text-align:center;
    width:90%;
  }
  #s6 .t-friend {
    bottom:10%; left:50%;
    transform:translateX(-50%);
    font-size:clamp(1rem,2.8vw,2rem);
    opacity:0.7;
    text-align:center;
  }

  /* ── SLIDE 7 ── */
  #s7 .t-you {
    bottom:10%; left:50%;
    transform:translateX(-50%);
    font-size:clamp(3rem,11vw,8rem);
    letter-spacing:-0.01em;
    text-align:center;
  }

  /* ── SLIDE 8 ── */
  #s8 .t-title {
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    font-size:clamp(2.8rem,9vw,7rem);
    letter-spacing:-0.02em;
    text-align:center;
    line-height:1;
    width:90%;
  }
  #s8 .t-enter {
    bottom:12%; left:50%;
    transform:translateX(-50%);
    font-size:0.88rem;
    letter-spacing:0.1em;
    opacity:0.35;
    animation:blink 2s ease-in-out infinite;
  }
</style>
</head>
<body>

<div class="cursor"     id="cursor"></div>
<div class="counter"    id="counter">1 / 8</div>
<div class="hint"       id="hint">cliquer pour continuer</div>
<div class="fade-cover" id="fade"></div>

<!-- ════ SLIDE 1 — bordeaux ════ -->
<div class="slide bg-b" id="s1">
  <div class="img-wrap">
    <img src="./1.png" alt="">
  </div>
  <div class="txt">uuh...</div>
</div>

<!-- ════ SLIDE 2 — blanc ════ -->
<div class="slide bg-w" id="s2">
  <div class="img-wrap">
    <img src="./2.png" alt="">
  </div>
  <div class="txt t-hello">hello,</div>
  <div class="txt t-uh">uh i guess</div>
</div>

<!-- ════ SLIDE 3 — bordeaux ════ -->
<div class="slide bg-b" id="s3">
  <div class="img-wrap">
    <img src="./3.png" alt="">
  </div>
  <div class="txt t-what">what is you doing here</div>
  <div class="txt t-you">did you come see me ?</div>
</div>

<!-- ════ SLIDE 4 — blanc ════ -->
<div class="slide bg-w" id="s4">
  <div class="img-wrap">
    <img src="./4.png" alt="">
  </div>
  <div class="txt t-cool">cool i guess</div>
  <div class="txt t-lonely">i was feelin<br>a little loneley</div>
</div>

<!-- ════ SLIDE 5 — bordeaux ════ -->
<div class="slide bg-b" id="s5">
  <div class="img-wrap">
    <img src="./5.png" alt="">
  </div>
  <div class="txt t-thought">i thought hey</div>
  <div class="txt t-komputer">i can create the kompiuter<br>and have friend</div>
</div>

<!-- ════ SLIDE 6 — blanc ════ -->
<div class="slide bg-w" id="s6">
  <div class="img-wrap">
    <img src="./6.png" alt="">
  </div>
  <div class="txt t-create">so i create<br>the kompiuter</div>
  <div class="txt t-friend">and now i have the friend !</div>
</div>

<!-- ════ SLIDE 7 — bordeaux ════ -->
<div class="slide bg-b" id="s7">
  <div class="img-wrap">
    <img src="./7.png" alt="">
  </div>
  <div class="txt t-you">you !</div>
</div>

<!-- ════ SLIDE 8 — blanc ════ -->
<div class="slide bg-w" id="s8">
  <div class="txt t-title">Ana & Adrien</div>
  <div class="txt t-enter">entrer</div>
</div>

<script>
// Skip si déjà vu
if (sessionStorage.getItem('intro-seen') === '1') {
  window.location.replace('home.html');
}

// Curseur
const curEl = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  curEl.style.left = e.clientX + 'px';
  curEl.style.top  = e.clientY + 'px';
  const active = document.querySelector('.slide.active');
  curEl.style.borderColor = active?.classList.contains('bg-b') ? '#FAF8F4' : '#8B1A2B';
});
document.addEventListener('mousedown', () => curEl.classList.add('click'));
document.addEventListener('mouseup',   () => curEl.classList.remove('click'));

// Slides
const slides = document.querySelectorAll('.slide');
const N = slides.length;
let current = 0, locked = false;

function updateChrome(i) {
  const isBord = slides[i].classList.contains('bg-b');
  const fg     = isBord ? '#FAF8F4' : '#8B1A2B';
  document.getElementById('hint').style.color    = fg;
  document.getElementById('counter').style.color = fg;
  curEl.style.borderColor = fg;
  document.getElementById('counter').textContent = (i+1) + ' / ' + N;
}

function show(i) {
  slides[i].classList.add('active');
  updateChrome(i);
}

function next() {
  if (locked) return;
  locked = true;
  document.getElementById('hint').style.opacity = '0';

  if (current === N - 1) {
    const fade = document.getElementById('fade');
    fade.style.background = '#FAF8F4';
    fade.classList.add('on');
    setTimeout(() => {
      sessionStorage.setItem('intro-seen','1');
      window.location.href = 'home.html';
    }, 650);
    return;
  }

  slides[current].classList.add('out');
  slides[current].classList.remove('active');
  current++;
  setTimeout(() => { show(current); locked = false; }, 320);
}

document.addEventListener('click',    next);
document.addEventListener('touchend', e => { e.preventDefault(); next(); }, { passive: false });
document.addEventListener('keydown',  e => { if ([' ','Enter','ArrowRight'].includes(e.key)) next(); });

show(0);
</script>
</body>
</html>
