<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idées Broderies 🧵</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --rose:#e8637a; --cream:#fdf6ee; --deep:#2a1a2e; --gold:#d4a853; --text:#3d2a35; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--cream); font-family:'DM Sans',sans-serif; color:var(--text); min-height:100vh; }
  body::before { content:''; position:fixed; inset:0; background-image:radial-gradient(circle,rgba(212,168,83,.1) 1px,transparent 1px); background-size:60px 60px; pointer-events:none; }
  .nav { padding:20px 32px; display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1; }
  .back-btn { text-decoration:none; color:var(--rose); font-size:.9rem; opacity:.8; transition:opacity .2s; }
  .back-btn:hover { opacity:1; }
  .page-wrap { max-width:820px; margin:0 auto; padding:8px 28px 80px; position:relative; z-index:1; }
  .page-header { text-align:center; margin-bottom:32px; }
  .page-header h1 { font-family:'Playfair Display',serif; font-size:clamp(1.8rem,5vw,2.5rem); color:var(--deep); }
  .page-header p { margin-top:8px; color:#9b7a88; font-size:.92rem; font-style:italic; }

  /* Filters */
  .filters { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:28px; }
  .filter-btn { padding:7px 18px; border-radius:100px; border:1.5px solid rgba(201,184,216,.5); background:white; font-family:'DM Sans',sans-serif; font-size:.83rem; cursor:pointer; transition:all .18s; color:#6b5060; }
  .filter-btn.active { background:var(--rose); color:white; border-color:var(--rose); }
  .filter-btn:hover:not(.active) { border-color:var(--rose); }

  /* Grid */
  .broderies-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }

  .card {
    background:white;
    border-radius:18px;
    overflow:hidden;
    border:1.5px solid rgba(201,184,216,.3);
    transition:all .22s;
    cursor:pointer;
    display:flex;
    flex-direction:column;
  }
  .card:hover { transform:translateY(-4px); box-shadow:0 8px 32px rgba(42,26,46,.1); border-color:rgba(232,99,122,.35); }

  .card-preview {
    height:160px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:4rem;
    position:relative;
    overflow:hidden;
  }

  .card-body { padding:18px 16px; flex:1; }
  .card-tag { display:inline-block; background:rgba(232,99,122,.1); color:var(--rose); padding:3px 10px; border-radius:100px; font-size:.72rem; font-weight:500; letter-spacing:.05em; text-transform:uppercase; margin-bottom:8px; }
  .card-title { font-family:'Playfair Display',serif; font-size:1rem; color:var(--deep); margin-bottom:6px; }
  .card-desc { font-size:.83rem; color:#6b5060; line-height:1.55; }
  .card-tips { margin-top:10px; font-size:.78rem; color:#9b7a88; font-style:italic; }

  /* difficulty dots */
  .diff { display:flex; gap:4px; margin-top:10px; align-items:center; }
  .diff-label { font-size:.72rem; color:#b899a6; margin-right:4px; }
  .dot { width:8px; height:8px; border-radius:50%; background:rgba(201,184,216,.4); }
  .dot.filled { background:var(--gold); }

  /* Detail modal */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(42,26,46,.5); backdrop-filter:blur(4px); z-index:100; align-items:center; justify-content:center; padding:24px; }
  .modal-overlay.active { display:flex; }
  .modal { background:var(--cream); border-radius:24px; padding:36px; max-width:460px; width:100%; border:1.5px solid rgba(212,168,83,.3); box-shadow:0 24px 80px rgba(42,26,46,.2); animation:popIn .3s ease; }
  @keyframes popIn { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
  .modal-preview { font-size:5rem; text-align:center; margin-bottom:16px; }
  .modal-title { font-family:'Playfair Display',serif; font-size:1.4rem; color:var(--deep); margin-bottom:8px; }
  .modal-tag { display:inline-block; background:rgba(232,99,122,.1); color:var(--rose); padding:3px 12px; border-radius:100px; font-size:.76rem; font-weight:500; letter-spacing:.05em; text-transform:uppercase; margin-bottom:16px; }
  .modal-desc { font-size:.92rem; color:#4a3040; line-height:1.6; margin-bottom:16px; }
  .modal-tips-title { font-weight:500; font-size:.85rem; color:var(--deep); margin-bottom:6px; }
  .modal-tips { font-size:.85rem; color:#6b5060; line-height:1.7; }
  .modal-tips li { margin-left:16px; }
  .close-btn { margin-top:24px; padding:12px 28px; background:var(--rose); color:white; border:none; border-radius:100px; font-family:'DM Sans',sans-serif; font-size:.92rem; cursor:pointer; transition:all .2s; }
  .close-btn:hover { background:#d4526a; }
</style>
</head>
<body>
<nav class="nav"><a href="index.html" class="back-btn">← Retour</a></nav>
<main class="page-wrap">
  <div class="page-header">
    <h1>Idées Broderies 🧵</h1>
    <p>des motifs stylés à broder sur t-shirts, tote bags, et plus</p>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" onclick="filter('all', this)">Toutes</button>
    <button class="filter-btn" onclick="filter('nature', this)">Nature</button>
    <button class="filter-btn" onclick="filter('typographie', this)">Typographie</button>
    <button class="filter-btn" onclick="filter('graphique', this)">Graphique</button>
    <button class="filter-btn" onclick="filter('amour', this)">Amour</button>
    <button class="filter-btn" onclick="filter('astro', this)">Astro</button>
  </div>

  <div class="broderies-grid" id="grid"></div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-preview" id="m-preview"></div>
    <div class="modal-tag" id="m-tag"></div>
    <div class="modal-title" id="m-title"></div>
    <div class="modal-desc" id="m-desc"></div>
    <div class="modal-tips-title">Conseils pratiques</div>
    <ul class="modal-tips" id="m-tips"></ul>
    <button class="close-btn" onclick="closeModal()">Fermer</button>
  </div>
</div>

<script>
const IDEAS = [
  {
    emoji: '🌸',
    tag: 'nature',
    title: 'Fleurs sauvages minimalistes',
    desc: 'Une tige avec deux ou trois petites fleurs stylisées à broder en point de tige. Rendu élégant et délicat.',
    diff: 2,
    tips: [
      'Utilise du fil DMC blanc cassé ou rose poudré',
      'Point de tige pour les tiges, point de nœud pour les cœurs de fleurs',
      'Place à l\'épaule ou sur la poitrine gauche',
      'Idéal sur t-shirt noir ou blanc'
    ],
    bg: '#fdeef3'
  },
  {
    emoji: '🌿',
    tag: 'nature',
    title: 'Branche de laurier',
    desc: 'Une branche de laurier stylisée, symbole de victoire et de noblesse. Très chic en fil doré sur blanc.',
    diff: 2,
    tips: [
      'Fil doré métallisé DMC pour un effet luxe',
      'Point de feuille pour chaque petite feuille ovale',
      'Fonctionne très bien sur col ou manche',
      'Ajoute quelques baies en points de nœud'
    ],
    bg: '#f0f8e8'
  },
  {
    emoji: '✨',
    tag: 'astro',
    title: 'Constellation personnalisée',
    desc: 'Brode la constellation de ton signe ou celui de ta copine, reliée de fins traits. Romantique et unique.',
    diff: 1,
    tips: [
      'Points de nœud pour les étoiles, trait fin pour les lignes',
      'Fil argenté ou blanc sur foncé pour un effet nuit',
      'Trouve les coordonnées exactes de votre constellation en ligne',
      'Idéal en petit format sur la nuque ou l\'épaule'
    ],
    bg: '#f0eeff'
  },
  {
    emoji: '🌙',
    tag: 'astro',
    title: 'Lune croissante & étoiles',
    desc: 'Un croissant de lune entouré de petites étoiles de tailles variées. Style boho, intemporel.',
    diff: 2,
    tips: [
      'Point de satin pour remplir la lune',
      'Variations de taille pour les étoiles (nœud + remplissage)',
      'Fil doré ou argent selon le fond du tissu',
      'Placer au centre-poitrine ou dans le dos'
    ],
    bg: '#fdf3e3'
  },
  {
    emoji: '🔤',
    tag: 'typographie',
    title: 'Un mot en cursive',
    desc: 'Un seul mot significatif brodé en écriture cursive élégante — "amor", "toujours", "merci", etc.',
    diff: 2,
    tips: [
      'Trace le mot au stylo thermique avant de broder',
      'Point de tige en suivant les courbes',
      'Fil noir mat sur blanc pour un effet graphique',
      'Choisir un mot court (3-7 lettres) pour commencer'
    ],
    bg: '#fdeef3'
  },
  {
    emoji: '🎯',
    tag: 'graphique',
    title: 'Smiley minimal',
    desc: 'Deux points et un sourire, en point de nœud et point arrière. Simplissime et incroyablement stylé.',
    diff: 1,
    tips: [
      'Ultra simple, parfait pour débuter',
      'Fil noir ou une couleur vive sur blanc',
      'Peut être très petit (1,5 cm) sur le col ou la manche',
      'Aussi très mignon à plusieurs sur un même vêtement'
    ],
    bg: '#fdf3e3'
  },
  {
    emoji: '🫀',
    tag: 'amour',
    title: 'Cœur anatomique stylisé',
    desc: 'Un cœur anatomique simplifié, moderne et un peu décalé. Pas kitsch — vraiment très cool.',
    diff: 3,
    tips: [
      'Utilise un patron imprimé comme guide sous le tissu',
      'Point de tige pour les contours, remplissage au point passé',
      'Rouge sang sur blanc ou crème',
      'Parfait en taille moyenne sur la poitrine'
    ],
    bg: '#fceaea'
  },
  {
    emoji: '🌊',
    tag: 'nature',
    title: 'Vague japonaise',
    desc: 'Inspirée du style ukiyo-e, une vague en lignes courbes répétées. Graphique, zen, magnifique.',
    diff: 3,
    tips: [
      'Séquence de lignes en point arrière courbes',
      'Fil bleu marine ou indigo sur beige',
      'Peut se faire en petit ou grand format',
      'Très efficace en répétition dans le bas d\'un t-shirt'
    ],
    bg: '#e6f1fb'
  },
  {
    emoji: '🐝',
    tag: 'nature',
    title: 'Petite abeille',
    desc: 'Une abeille stylisée avec corps rayé et ailes translucides. Joyeuse et symbolique (travail, douceur).',
    diff: 2,
    tips: [
      'Corps en point de satin jaune et noir en alternance',
      'Ailes en point avant avec fil brillant ivoire',
      'Idéale en très petit format : 2-3 cm',
      'Jolie sur une poche de chemise ou au col'
    ],
    bg: '#faeeda'
  },
  {
    emoji: '♾️',
    tag: 'amour',
    title: 'Infini',
    desc: 'Le symbole de l\'infini — ∞ — brodé en fil doré ou argenté. Simple, élégant, chargé de sens.',
    diff: 1,
    tips: [
      'Un seul trait continu en point de tige',
      'Fil doré ou rose pour un rendu précieux',
      'Très beau en petit sur le poignet de la manche',
      'Peut être agrandi avec des petits points autour'
    ],
    bg: '#fdeef3'
  },
  {
    emoji: '🌺',
    tag: 'nature',
    title: 'Hibiscus brésilien',
    author: '🇧🇷',
    desc: 'La fleur nationale du Brésil, aux pétales larges et au pistil proéminent. Colorée et tropicale.',
    diff: 3,
    tips: [
      'Rouge vif, rose ou orange pour les pétales',
      'Point de satin pour les pétales, pistil en point de chaîne',
      'Grand format : très beau dans le dos d\'un t-shirt',
      'Combiner plusieurs couleurs pour un effet vibrant'
    ],
    bg: '#fdeef3'
  },
  {
    emoji: '🎸',
    tag: 'graphique',
    title: 'Guitare filaire',
    desc: 'Le contour d\'une guitare acoustique en un seul trait continu, style linéaire et artistique.',
    diff: 2,
    tips: [
      'Trace le contour au crayon effaçable d\'abord',
      'Point arrière fin pour un trait précis',
      'Fil noir ou couleur selon l\'ambiance voulue',
      'Très beau en grand format dans le dos'
    ],
    bg: '#f3eeff'
  },
];

let currentFilter = 'all';

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  IDEAS.filter(i => currentFilter === 'all' || i.tag === currentFilter).forEach((idea, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-preview" style="background:${idea.bg}">${idea.emoji}</div>
      <div class="card-body">
        <div class="card-tag">${idea.tag}</div>
        <div class="card-title">${idea.title}</div>
        <div class="card-desc">${idea.desc.slice(0,80)}…</div>
        <div class="diff">
          <span class="diff-label">Niveau</span>
          ${[1,2,3].map(d => `<div class="dot${d<=idea.diff?' filled':''}"></div>`).join('')}
        </div>
      </div>`;
    card.onclick = () => openModal(idea);
    grid.appendChild(card);
  });
}

function filter(tag, btn) {
  currentFilter = tag;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function openModal(idea) {
  document.getElementById('m-preview').textContent = idea.emoji;
  document.getElementById('m-tag').textContent = idea.tag;
  document.getElementById('m-title').textContent = idea.title;
  document.getElementById('m-desc').textContent = idea.desc;
  document.getElementById('m-tips').innerHTML = idea.tips.map(t => `<li>${t}</li>`).join('');
  document.getElementById('modal').classList.add('active');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('active');
  }
}

render();
</script>
</body>
</html>
