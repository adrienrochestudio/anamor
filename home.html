<style>
  body { text-align: center; }

  header {
    padding: 64px 40px 72px;
  }

  .title-main {
    font-size: clamp(3.2rem, 10vw, 7rem);
    color: var(--bord);
    line-height: 1;
  }

  .title-sub {
    margin-top: 14px;
    font-size: 1rem;
    color: var(--muted);
    display: inline-block;
    cursor: pointer;
    padding: 2px 8px;
    transition: background .18s, color .18s;
    text-decoration: none;
  }

  .title-sub:hover {
    background: rgba(139, 26, 43, 0.08);
    color: var(--bord);
  }

  .citation-wrap {
    max-width: 640px;
    margin: -48px auto 44px;
    padding: 0 40px;
    display: none;
    align-items: baseline;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
  }

  .citation-wrap.active {
    display: flex;
  }

  .citation-text {
    font-size: 1.05rem;
    color: var(--text);
    line-height: 1.65;
    text-align: center;
  }

  .citation-author {
    display: block;
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 6px;
    text-align: center;
  }

  .citation-aside {
    font-size: 0.88rem;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .corner-character-link {
    position: absolute;
    bottom: -20px;
    right: -60px;
    width: 120px;
    height: auto;
    z-index: 10;
    display: block;
  }

  .corner-character {
    width: 100%;
    height: auto;
    display: block;
    pointer-events: auto;
  }

  .corner-character-link:hover {
    opacity: 0.75;
  }

  .modal-main-title {
    font-size: 1.1rem;
    color: var(--bord);
    margin-bottom: 6px;
    text-align: center;
  }

  .wheel-section {
    padding: 56px 40px 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
  }

  .wheel-container {
    position: relative;
    width: 420px;
    height: 420px;
    max-width: 86vw;
    max-height: 86vw;
  }

  #wheel-canvas {
    width: 100%;
    height: 100%;
  }

  .wheel-pointer {
    position: absolute;
    top: -28px;
    left: 50%;
    transform: translateX(-50%) rotate(-5deg);
    width: 38px;
    height: 34px;
    z-index: 6;
    cursor: pointer;
    display: block;
    text-decoration: none;
    transition: opacity .18s, transform .18s;
  }

  .wheel-pointer:hover {
    opacity: 0.75;
    transform: translateX(-50%) rotate(-5deg) scale(1.08);
  }

  .wheel-pointer svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  .wheel-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    width: 72px;
    height: 72px;
    border-radius: 50%;

    border: var(--trait) solid var(--bord);
    display: flex;

    justify-content: center;
    z-index: 5;

    transition: background .18s, color .18s;
    overflow: hidden;
  }

  .wheel-center:hover {

    color: var(--blanc);
  }

  .wheel-center img {

    height: 100%;
    object-fit: cover;
    border-radius: 50%;

  }

<script>
const MOTS = [

  { text:"Amar é a única coisa que cresce quanto mais se divide.", author:"Paulo Coelho" },
  { text:"L'amour est la poésie des sens.", author:"Honoré de Balzac" },
  { text:"Quem ama não calcula, não mede, não pesa, apenas ama.", author:"Fernando Pessoa" },
  { text:"Aimer, c'est trouver sa richesse hors de soi.", author:"Alain" },
];

(function() {
  const sh  = new Date(Date.now() - 2*3600*1000);
  const key = sh.getFullYear()*10000 + (sh.getMonth()+1)*100 + sh.getDate();
  const m   = MOTS[key % MOTS.length];
  document.getElementById('cit-text').textContent = '\u201c' + m.text + '\u201d';
  document.getElementById('cit-author').textContent = '- ' + m.author;
})();

document.getElementById('kompiuter-trigger').addEventListener('click', () => {
  document.getElementById('citation-wrap').classList.toggle('active');
});

const SECTIONS = [
  { label:"poems", url:"poeme.html", desc:"A love poem, picked at random. French or Brazilian, oh là là." },
  { label:"trivia", url:"quiz-histoire.html", desc:"France & Brazil mixed, who knows the most, huh ?" },
  { label:"krowz wourd", url:"mots-croises.html", desc:"Fill in the grids. Score is saved, bah oui." },
 { label:"musik", url:"apprendre-cancao.html", desc:"On se recommande des musiques!" },
  { label:"learn lagagne", wheelLabel:"lagagne", url:"learn-langagne.html", desc:"Des flashcards. français ou português, on apprend la lagagne par petits lots." },
  { label:"absolute cinema", url:"filmographie.html", desc:"Adrien's films, sorted by director." },
  { label:"jio gessah", url:"https://www.worldguessr.com/", desc:"c'est the free version, i am a rats uh ratatouille.", external:true },
  { label:"todo", url:"https://www.icloud.com/notes/038_LgyD3tTC4I2XbACKHyCzA#To_do_AA", desc:"Our shared list. the important stuff.", external:true, warning:"if you are not ana or adrien it will not work, cherche pas. otherwise have fun !" },
];

const RARE_CHANCE = 0.30;

const RARE_EVENTS = [
  {
    type: "message",
    title: "the wheel is tired.",
    desc: "spin again.",
    goText: "spim again",
    goAction: "spin"
  },
  {
    type: "message",
    title: "adrian refuses this category",
    desc: "ugh iam soooo bored gonna call tina",
    goText: "spim again",
    goAction: "spin"
  },
  {
    type: "link",
    title: "secret cinema mode unlocked",
    desc: "karim debbache has entered the kompiuter.",
    url: "https://www.senscritique.com/liste/les_films_recommandes_par_karim_debbache_crossed/293391",
    goText: "open it"
  },
  {
    type: "image",
    title: "the little man has chosen violence."
  }
];

const wrap = document.getElementById('cards-wrap');

SECTIONS.forEach(s => {
  const a = document.createElement('a');
  a.href = s.url;
  a.className = 'mini-card';
  if (s.external) {
    a.target = '_blank';
    a.rel = 'noopener';
  }
  a.textContent = s.label;
  wrap.appendChild(a);
});

const canvas = document.getElementById('wheel-canvas');
const ctx = canvas.getContext('2d');
const N = SECTIONS.length;
const ARC = (2 * Math.PI) / N;
let angle = 0;
let spinning = false;
const BORD = '#8B1A2B';
const BLANC = '#FAF8F4';

function softWobble(baseR, angle, sliceIdx) {
  const phase = sliceIdx * 2.3;
  return baseR
    + Math.sin(angle * 3 + phase) * 3.5
    + Math.sin(angle * 7 + phase * 1.7) * 1.5;
}

function drawSlice(cx, cy, baseR, s0, s1, sliceIdx, fill, stroke) {
  const steps = 48;
  ctx.beginPath();
  ctx.moveTo(cx, cy);

  for (let k = 0; k <= steps; k++) {
    const a = s0 + (s1 - s0) * (k / steps);
    const r = softWobble(baseR, a, sliceIdx);
    ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
  }

  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = stroke;
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawWheel(a) {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const r = cx - 10;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < N; i++) {
    const s0 = a + i * ARC - Math.PI / 2;
    const s1 = s0 + ARC;
    const even = i % 2 === 0;

    drawSlice(cx, cy, r, s0, s1, i, even ? BORD : BLANC, BORD);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(s0 + ARC / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = even ? BLANC : BORD;
    ctx.font = 'bold 18px "Patrick Hand", cursive';
    const wheelText = SECTIONS[i].wheelLabel || SECTIONS[i].label;
    ctx.fillText(wheelText, r - 20, 7);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(cx, cy, 40, 0, 2 * Math.PI);
  ctx.fillStyle = BLANC;
  ctx.fill();
  ctx.strokeStyle = BORD;
  ctx.lineWidth = 2;
  ctx.stroke();
}

drawWheel(angle);

function spinWheel() {
  if (spinning) return;

  closeModal();
  closeRareImage();

  spinning = true;
  document.getElementById('spin-btn').disabled = true;

  const extra = 2 * Math.PI * (7 + Math.random() * 6);
  const dur = 3600 + Math.random() * 1200;
  const t0 = performance.now();
  const a0 = angle;
  const ease = t => 1 - Math.pow(1 - t, 4);

  function frame(now) {
    const t = Math.min((now - t0) / dur, 1);
    angle = a0 + extra * ease(t);
    drawWheel(angle);

    if (t < 1) {
      requestAnimationFrame(frame);
      return;
    }

    spinning = false;
    document.getElementById('spin-btn').disabled = false;
    showResult();
  }

  requestAnimationFrame(frame);
}

/* ── le moindre clic n'importe ou sur l'accueil declenche la surprise.
   se relance a chaque chargement de page (garde-fou seulement contre
   un double-declenchement dans le meme chargement). capture = on prend
   la main avant le clic normal. */
let nmTakeoverDone = false;
document.addEventListener('click', function (e) {
  if (nmTakeoverDone) return;
  nmTakeoverDone = true;
  e.preventDefault();
  e.stopPropagation();
  namoradosTakeover();
}, true);

/* ── prise de controle namorados ──────────────────────────
   la roue tombe, des coeurs montent, l'ecran "bug" comme si
   le site etait hacke, puis on bascule sur la soiree. */
function namoradosTakeover() {
  // 1) la roue tombe
  document.querySelector('.wheel-container').classList.add('nm-fall');

  // 2) de vrais coeurs dessines qui montent du bas
  const COLORS = ['#8B1A2B', '#c2452d', '#2d5fc2'];
  const heartSVG = (c, s) => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 32 30">' +
    '<path d="M16 27 C8 20 2 15 2 9 C2 4 6 1 10 3 C13 4 15 7 16 9 C17 7 19 4 22 3 C26 1 30 4 30 9 C30 15 24 20 16 27Z"' +
    ' fill="' + c + '" stroke="#8B1A2B" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  for (let i = 0; i < 46; i++) {
    setTimeout(() => {
      const h = document.createElement('span');
      h.className = 'nm-heart';
      h.style.left = (4 + Math.random() * 92) + 'vw';
      h.style.setProperty('--r', (Math.random() * 50 - 25) + 'deg');
      h.style.animationDuration = (2.6 + Math.random() * 2.6) + 's';
      h.innerHTML = heartSVG(COLORS[i % COLORS.length], Math.round(18 + Math.random() * 26));
      document.body.appendChild(h);
    }, 300 + i * 85);
  }

  // 3) l'ecran clignote comme un bug
  setTimeout(() => document.body.classList.add('nm-glitch'), 700);

  // 4) le kompiuter panique puis avoue
  const lines = [
    'uuh...',
    'somethin is wrong',
    'o no o no',
    'wait',
    'is not a bug. is for you'
  ];
  const txt = document.createElement('div');
  txt.id = 'nm-glitch-text';
  document.body.appendChild(txt);
  lines.forEach((l, i) => setTimeout(() => { txt.textContent = l; }, 800 + i * 950));

  // 5) on part a la soiree
  setTimeout(() => { window.location.href = 'namorados/index.html'; }, 800 + lines.length * 950 + 600);
}

function showResult() {
  const norm = (((-angle) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  const idx = Math.floor(norm / ARC) % N;
  const s = SECTIONS[idx];

  if (Math.random() < RARE_CHANCE) {
    showRareEvent();
    return;
  }

  showNormalResult(s);
}

function showNormalResult(s) {
  const modal = document.getElementById('modal');
  const titleEl = document.getElementById('modal-title');
  const descEl = document.getElementById('modal-desc');
  const warnEl = document.getElementById('modal-warning');
  const btnsEl = document.getElementById('modal-btns');
  const lnk = document.getElementById('modal-go');

  modal.classList.remove('secret-active');

  titleEl.textContent = s.label;
  descEl.textContent = s.desc;

  if (s.warning) {
    warnEl.textContent = s.warning;
    warnEl.style.display = 'block';
  } else {
    warnEl.textContent = '';
    warnEl.style.display = 'none';
  }

  btnsEl.style.display = 'flex';

  lnk.textContent = "let's go";
  lnk.href = s.url;
  lnk.target = s.external ? '_blank' : '';

  lnk.onclick = null;

  if (s.external) {
    lnk.rel = 'noopener';
  } else {
    lnk.removeAttribute('rel');
  }

  modal.classList.add('active');
}

function showRareEvent() {
  const rare = RARE_EVENTS[Math.floor(Math.random() * RARE_EVENTS.length)];

  if (rare.type === "image") {
    showRareImage();
    return;
  }

  const modal = document.getElementById('modal');
  const titleEl = document.getElementById('modal-title');
  const descEl = document.getElementById('modal-desc');
  const warnEl = document.getElementById('modal-warning');
  const btnsEl = document.getElementById('modal-btns');
  const lnk = document.getElementById('modal-go');

  modal.classList.add('secret-active');

  titleEl.textContent = rare.title;
  descEl.textContent = rare.desc || '';
  warnEl.textContent = '';
  warnEl.style.display = 'none';
  btnsEl.style.display = 'flex';

  lnk.textContent = rare.goText || "ok";

  if (rare.type === "link") {
    lnk.href = rare.url;
    lnk.target = '_blank';
    lnk.rel = 'noopener';
    lnk.onclick = null;
  }

  if (rare.goAction === "spin") {
    lnk.href = "#";
    lnk.target = "";
    lnk.removeAttribute('rel');
    lnk.onclick = function(e) {
      e.preventDefault();
      closeModal();
      spinWheel();
    };
  }

  modal.classList.add('active');
}

function showRareImage() {
  const overlay = document.getElementById('rare-image-overlay');
  overlay.classList.add('secret-active');
  overlay.classList.add('active');
}

function closeRareImage() {
  const overlay = document.getElementById('rare-image-overlay');
  overlay.classList.remove('active');
  overlay.classList.remove('secret-active');
}

function closeModal() {
  const modal = document.getElementById('modal');
  modal.classList.remove('active');
  modal.classList.remove('secret-active');
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});

document.getElementById('rare-image-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('rare-image-overlay')) closeRareImage();
});

document.getElementById('wheel-center').addEventListener('click', spinWheel);

function replayIntro() {
  sessionStorage.removeItem('intro-seen');
  window.location.href = 'index.html';
}
</script>
</body>
</html>
