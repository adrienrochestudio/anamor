<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ana & Adrien</title>
<link rel="stylesheet" href="style.css">
<style>
  /* ── HEADER centré ── */
  header {
    padding: 64px 40px 40px;
    border-bottom: var(--trait) solid var(--bord-l);
    text-align: center;
  }

  .title-main {
    font-size: clamp(3.2rem, 10vw, 7rem);
    color: var(--bord);
    line-height: 1;
    letter-spacing: -0.01em;
  }

  .title-sub {
    margin-top: 10px;
    font-size: 1rem;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  /* ── CITATION ── */
  .citation-wrap {
    padding: 32px 40px;
    border-bottom: var(--trait) solid var(--bord-l);
    display: flex;
    align-items: baseline;
    gap: 20px;
    flex-wrap: wrap;
  }

  .citation-text {
    font-size: 1.05rem;
    color: var(--text);
    line-height: 1.65;
    flex: 1;
    min-width: 220px;
  }

  .citation-right {
    font-size: 0.88rem;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
    align-self: flex-end;
  }

  .citation-author {
    display: block;
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 6px;
  }

  /* ── ROUE ── */
  .wheel-section {
    padding: 48px 40px 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    border-bottom: var(--trait) solid var(--bord-l);
  }

  .wheel-container {
    position: relative;
    width: 440px; height: 440px;
    max-width: 88vw; max-height: 88vw;
  }

  #wheel-canvas { width:100%; height:100%; }

  .wheel-pointer {
    position: absolute;
    top: -20px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 11px solid transparent;
    border-right: 11px solid transparent;
    border-top: 24px solid var(--bord);
    z-index: 6;
  }

  .wheel-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 76px; height: 76px;
    border-radius: 50%;
    background: var(--blanc);
    border: var(--trait) solid var(--bord);
    display: flex; align-items: center; justify-content: center;
    z-index: 5; cursor: pointer;
    font-size: 1rem; color: var(--bord);
    transition: background .18s, color .18s;
    overflow: hidden;
  }

  .wheel-center:hover { background: var(--bord); color: var(--blanc); }
  .wheel-center img   { width:100%; height:100%; object-fit:cover; border-radius:50%; display:none; }

  /* ── GRILLE ── */
  .activities { padding: 40px; }

  .activities-label {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .mini-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: var(--trait);
    border: var(--trait) solid var(--bord-l);
  }

  .mini-card {
    padding: 22px 18px;
    border: none;
    background: transparent;
    text-decoration: none;
    color: var(--text);
    font-family: 'Patrick Hand', cursive;
    font-size: 1rem;
    cursor: pointer;
    transition: background .18s, color .18s;
    display: flex; flex-direction: column; gap: 6px;
    text-align: left;
    border-right: var(--trait) solid var(--bord-l);
    border-bottom: var(--trait) solid var(--bord-l);
  }

  .mini-card:hover { background: var(--bord); color: var(--blanc); }
  .mini-card:hover .card-num { color: rgba(250,248,244,0.4); }

  .card-num { font-size: 0.75rem; color: var(--muted); transition: color .18s; }

  /* ── MODAL ── */
  .modal-bar { width:32px; height:var(--trait); background:var(--bord); margin-bottom:20px; }
  .modal-title-text { font-size:1.6rem; color:var(--bord); margin-bottom:10px; }
  .modal-desc { font-size:1rem; color:var(--muted); line-height:1.65; margin-bottom:28px; }
  .modal-btns { display:flex; gap:10px; flex-wrap:wrap; }
</style>
</head>
<body>

<header>
  <div class="title-main">Ana & Adrien</div>
  <div class="title-sub">the kompiuter</div>
</header>

<!-- Citation du jour -->
<div class="citation-wrap">
  <div>
    <div class="citation-text" id="cit-text"></div>
    <span class="citation-author" id="cit-author"></span>
  </div>
  <div class="citation-right">... i guess uh</div>
</div>

<!-- Roue -->
<section class="wheel-section">
  <div class="wheel-container">
    <div class="wheel-pointer"></div>
    <canvas id="wheel-canvas" width="440" height="440"></canvas>
    <div class="wheel-center" id="wheel-center" onclick="spinWheel()">
      <span id="wheel-initials">A&A</span>
      <img id="wheel-img" src="" alt="">
    </div>
  </div>
  <button class="btn btn-full" onclick="spinWheel()" id="spin-btn">spin it</button>
</section>

<!-- Grille -->
<section class="activities">
  <div class="activities-label">or pick something</div>
  <div class="mini-grid" id="mini-grid"></div>
</section>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-bar"></div>
    <div class="modal-title-text" id="modal-title"></div>
    <div class="modal-desc"       id="modal-desc"></div>
    <div class="modal-btns">
      <a href="#" class="btn btn-full" id="modal-go">let's go</a>
      <button class="btn" onclick="closeModal()">nah</button>
    </div>
  </div>
</div>

<footer>Ana & Adrien — the kompiuter</footer>

<script>
const MOTS = [
  { text:"Aimer, ce n'est pas se regarder l'un l'autre, c'est regarder ensemble dans la même direction.", author:"Antoine de Saint-Exupéry" },
  { text:"O amor é uma força que une dois corações e os faz bater como um só.", author:"Drummond de Andrade" },
  { text:"Il n'y a qu'un bonheur dans la vie, c'est d'aimer et d'être aimé.", author:"George Sand" },
  { text:"Amar é encontrar na felicidade do outro a própria felicidade.", author:"Gottfried Leibniz" },
  { text:"Le cœur a ses raisons que la raison ne connaît point.", author:"Blaise Pascal" },
  { text:"De tudo, ao meu amor serei atento antes, e com tal zelo, e sempre, e tanto.", author:"Vinícius de Moraes" },
  { text:"Un seul être vous manque, et tout est dépeuplé.", author:"Alphonse de Lamartine" },
  { text:"Amar é dar ao outro o poder de te destruir, e confiar que não o fará.", author:"C. S. Lewis" },
  { text:"On ne voit bien qu'avec le cœur. L'essentiel est invisible pour les yeux.", author:"Antoine de Saint-Exupéry" },
  { text:"O amor não olha a distância, porque o coração não tem fronteiras.", author:"Rubem Alves" },
  { text:"Là où tu vas, j'irai. Là où tu mourras, je mourrai.", author:"Livre de Ruth" },
  { text:"Amar é a única coisa que cresce quanto mais se divide.", author:"Paulo Coelho" },
  { text:"L'amour est la poésie des sens.", author:"Honoré de Balzac" },
  { text:"Quem ama não calcula, não mede, não pesa — apenas ama.", author:"Fernando Pessoa" },
  { text:"Aimer, c'est trouver sa richesse hors de soi.", author:"Alain" },
];

(function() {
  const now = new Date();
  const sh  = new Date(now.getTime() - 2*3600*1000);
  const key = sh.getFullYear()*10000+(sh.getMonth()+1)*100+sh.getDate();
  const m   = MOTS[key % MOTS.length];
  document.getElementById('cit-text').textContent   = '\u201c' + m.text + '\u201d';
  document.getElementById('cit-author').textContent = '— ' + m.author;
})();

// 6 sections (Metrodoku retiré — c'est la case en trop)
const SECTIONS = [
  { label:"poems",    url:"poeme.html",          desc:"A love poem, picked at random. French or Brazilian, oh là là." },
  { label:"trivia",   url:"quiz-histoire.html",   desc:"France & Brazil mixed — who knows the most, huh ?" },
  { label:"crossword",url:"mots-croises.html",    desc:"Fill in the grids. Score is saved, bah oui." },
  { label:"us",       url:"quiz-nous.html",       desc:"Do we really know each other ? let's see..." },
  { label:"cinema",   url:"filmographie.html",    desc:"Adrien's films, sorted by director." },
  { label:"todo",     url:"https://www.icloud.com/notes/038_LgyD3tTC4I2XbACKHyCzA#To_do_AA",
                                                  desc:"Our shared list. the important stuff." },
];

const grid = document.getElementById('mini-grid');
SECTIONS.forEach((s,i) => {
  const a = document.createElement('a');
  a.href = s.url;
  a.className = 'mini-card';
  if (s.url.startsWith('http')) a.target = '_blank';
  a.innerHTML = `<span class="card-num">${String(i+1).padStart(2,'0')}</span><span>${s.label}</span>`;
  grid.appendChild(a);
});

/* ── ROUE — bords irréguliers ── */
const canvas = document.getElementById('wheel-canvas');
const ctx    = canvas.getContext('2d');
const N      = SECTIONS.length;
const ARC    = (2*Math.PI) / N;
let angle    = 0, spinning = false;
const BORD   = '#8B1A2B';
const BLANC  = '#FAF8F4';

// Génère une perturbation fixe par section pour simuler des bords irréguliers
const seed = 42;
function seededRand(i) {
  const x = Math.sin(i * 9301 + seed * 49297) * 93.7;
  return x - Math.floor(x);
}

// Pour chaque tranche : points légèrement décalés sur le bord extérieur
function wobbleArc(cx, cy, r, startAngle, endAngle, steps, idx) {
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  // Ligne vers le début de l'arc avec léger wobble
  const wobble = 5; // pixels max de décalage
  for (let s = 0; s <= steps; s++) {
    const t   = s / steps;
    const ang = startAngle + t * (endAngle - startAngle);
    const w   = (seededRand(idx * 37 + s) - 0.5) * wobble * 2;
    const rr  = r + w;
    if (s === 0) ctx.moveTo(cx + Math.cos(startAngle) * r, cy + Math.sin(startAngle) * r);
    ctx.lineTo(cx + Math.cos(ang) * rr, cy + Math.sin(ang) * rr);
  }
  ctx.lineTo(cx, cy);
  ctx.closePath();
}

function drawWheel(a) {
  const cx = canvas.width/2, cy = canvas.height/2, r = cx - 8;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < N; i++) {
    const s0   = a + i * ARC - Math.PI/2;
    const s1   = s0 + ARC;
    const even = i % 2 === 0;

    wobbleArc(cx, cy, r, s0, s1, 32, i);
    ctx.fillStyle   = even ? BORD : BLANC;
    ctx.fill();
    ctx.strokeStyle = BORD;
    ctx.lineWidth   = 2.5;
    ctx.stroke();

    // Texte — plus grand, lisible
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(s0 + ARC/2);
    ctx.textAlign  = 'right';
    ctx.fillStyle  = even ? BLANC : BORD;
    ctx.font       = '700 17px "Patrick Hand", cursive';
    ctx.fillText(SECTIONS[i].label, r - 22, 6);
    ctx.restore();
  }

  // Cercle central pour masquer le wobble au centre
  ctx.beginPath();
  ctx.arc(cx, cy, 42, 0, 2*Math.PI);
  ctx.fillStyle = BLANC;
  ctx.fill();
  ctx.strokeStyle = BORD;
  ctx.lineWidth = 2.5;
  ctx.stroke();
}

drawWheel(angle);

function spinWheel() {
  if (spinning) return;
  spinning = true;
  document.getElementById('spin-btn').disabled = true;
  const extra = 2*Math.PI*(7 + Math.random()*6);
  const dur   = 3600 + Math.random()*1200;
  const t0    = performance.now();
  const a0    = angle;
  function ease(t) { return 1 - Math.pow(1-t, 4); }
  function frame(now) {
    const t = Math.min((now-t0)/dur, 1);
    angle = a0 + extra*ease(t);
    drawWheel(angle);
    if (t < 1) { requestAnimationFrame(frame); return; }
    spinning = false;
    document.getElementById('spin-btn').disabled = false;
    showResult();
  }
  requestAnimationFrame(frame);
}

function showResult() {
  const norm = (((-angle) % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
  const idx  = Math.floor(norm / ARC) % N;
  const s    = SECTIONS[idx];
  document.getElementById('modal-title').textContent = s.label;
  document.getElementById('modal-desc').textContent  = s.desc;
  const lnk  = document.getElementById('modal-go');
  lnk.href   = s.url;
  lnk.target = s.url.startsWith('http') ? '_blank' : '';
  document.getElementById('modal').classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});
document.getElementById('wheel-center').addEventListener('click', spinWheel);
</script>
</body>
</html>
